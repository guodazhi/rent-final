<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Approved Listings</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 40px;
    }
    h1 {
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .price {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Approved Listings</h1>
<div id="listings">Loading...</div>

<script>
async function loadListings() {
  try {
    const res = await fetch('/.netlify/functions/listings')
    const data = await res.json()

    const container = document.getElementById('listings')

    if (!data.length) {
      container.innerHTML = "<p>No approved listings yet.</p >"
      return
    }

    container.innerHTML = data.map(item => `
      <div class="card">
        <h3>${item.title}</h3>
        <p class="price">$${item.price}</p >
        <p>📍 ${item.location}</p >
        <p>📞 ${item.contact}</p >
      </div>
    `).join('')

  } catch (err) {
    document.getElementById('listings').innerHTML =
      "<p style='color:red;'>Error loading listings</p >"
  }
}

loadListings()
</script>

</body>
</html>
