<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>收藏 · 翱翔安居 XATU</title>

  <script src="/assets/config.js"></script>
  <link rel="stylesheet" href="/assets/app.css" />
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <div class="container pad-bottom">
    <div class="shell">
      <div class="topbar">
        <a class="backbtn" href=" " aria-label="back">← 返回</a >

        <div class="brand">
          < img src="/assets/logo.png" alt="logo" />
          <div>
            <div class="title">翱翔安居 · XATU</div>
            <div class="sub">收藏 / Favorites</div>
          </div>
        </div>

        <div class="actions">
          <a class="pill" href="/support.html">💬 <small>客服</small></a >
          <a class="pill" href="/submit.html">＋ <small>发布</small></a >
        </div>
      </div>

      <div class="header">
        <div class="h1">收藏</div>
        <div class="h2">这里显示你收藏的房源</div>
      </div>

      <div class="card filters">
        <div class="row">
          <button class="btn" id="btnClearFav">清空收藏</button>
          <div class="spacer"></div>
          <div class="badge" id="favCount">0</div>
        </div>
      </div>

      <div class="listings" id="listings"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="inner">
      <a class="tab" href="/"><div class="dot">🏠</div><div>租房</div></a >
      <a class="tab" href="/submit.html"><div class="dot">＋</div><div>发布</div></a >
      <a class="tab active" href="/favorites.html"><div class="dot">⭐</div><div>收藏</div></a >
      <a class="tab" href="/support.html"><div class="dot">💬</div><div>客服</div></a >
    </div>
  </div>

  <script>
    (async function(){
      const { XATU } = window;
      await XATU.auth.setSessionFromUrlIfPresent();

      const listingsEl = document.getElementById("listings");
      const favCount = document.getElementById("favCount");

      function render(items){
        const favs = XATU.favs.load();
        favCount.textContent = `收藏数：${favs.length}`;
        if(!favs.length){
          listingsEl.innerHTML = `<div class="notice">你还没有收藏任何房源。去首页点 “收藏” 吧。</div>`;
          return;
        }

        const map = new Map(items.map(x => [String(x.id ?? x.uuid ?? x.created_at), x]));
        const list = favs.map(id => map.get(String(id))).filter(Boolean);

        listingsEl.innerHTML = list.map(item => {
          const id = item.id ?? item.uuid ?? item.created_at;
          return `
            <div class="card item" data-id="${String(id)}">
              <div class="name">${item.title || "未命名房源"}</div>
              <div class="meta">
                <div>${item.campus || "—"}</div>
                <div>${item.location || "—"}</div>
              </div>
              <div class="price">¥ ${item.price ?? "—"}</div>
              <div class="btns">
                <button class="btn" data-act="unfav">取消收藏</button>
                <button class="btn primary" data-act="contact">☎ 联系</button>
                <span class="badge">${item.rent_type || "—"} · ${item.bath_type || "—"}</span>
              </div>
            </div>
          `;
        }).join("");
      }

      async function load(){
        // 拉一遍最新 listings，再按收藏 id 过滤（简单可靠）
        const data = await XATU.listings.fetch({ limit: 200 });
        render(data || []);
      }

      listingsEl.addEventListener("click", async (e)=>{
        const btn = e.target.closest("button");
        if(!btn) return;
        const itemEl = e.target.closest(".item");
        const id = itemEl?.dataset?.id;
        const act = btn.dataset.act;
        if(!id) return;

        if(act === "unfav"){
          XATU.favs.toggleFav(String(id));
          load();
        }
        if(act === "contact"){
          alert("联系功能：请在 listings 表中为该房源填写 contact 字段（如 微信/手机号）。");
        }
      });

      document.getElementById("btnClearFav").onclick = () => {
        XATU.favs.save([]);
        load();
      };

      load();
    })();
  </script>
</body>
</html>
