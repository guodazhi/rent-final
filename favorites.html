<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>收藏 · 翱翔安居</title>

  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{--bg:#f6f8fb;--card:#ffffffcc;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--shadow:0 10px 30px rgba(17,24,39,.08);--radius:16px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"PingFang SC","Microsoft Yahei",sans-serif;background:radial-gradient(1200px 600px at 15% 0%, #eaf2ff 0%, transparent 55%),radial-gradient(900px 500px at 85% 10%, #e9fff2 0%, transparent 50%),var(--bg);color:var(--text);padding-bottom:74px;}
    .topbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:linear-gradient(to bottom, rgba(246,248,251,.92), rgba(246,248,251,.72));border-bottom:1px solid var(--line);}
    .topbar .inner{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;}
    .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;}
    .brand{display:flex;align-items:center;gap:10px;}
    .logo{width:34px;height:34px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line);}
    .t1{font-weight:900;font-size:14px;line-height:1.1}
    .t2{font-size:12px;color:var(--muted)}
    .spacer{flex:1}
    .btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:12px;font-size:13px;cursor:pointer;}
    .btn.primary{background:var(--primary);color:#fff;border-color:transparent;}
    .wrap{max-width:980px;margin:0 auto;padding:18px 16px 24px;}
    .card{background:var(--card);border:1px solid rgba(229,231,235,.85);border-radius:var(--radius);box-shadow:var(--shadow);}
    .hd{padding:16px 16px 10px;}
    .h1{font-size:22px;font-weight:900;margin:0;}
    .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
    .list{padding:0 16px 16px;}
    .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;display:flex;gap:12px;align-items:flex-start;}
    .title{font-weight:900;margin:0;font-size:15px;}
    .desc{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4;}
    .badge{font-size:12px;border:1px solid var(--line);background:#f9fafb;padding:4px 8px;border-radius:999px;color:var(--muted);white-space:nowrap;}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
    .right{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
    .tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 12px;z-index:20;}
    .tabs{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 6px;border-radius:14px;border:1px solid transparent;color:var(--muted);font-size:12px;text-decoration:none;}
    .tab.active{background:#eef2ff;border-color:#dbeafe;color:#1d4ed8;font-weight:900;}
    .tab .ic{font-size:16px;line-height:1;}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:#111827;color:#fff;padding:10px 12px;border-radius:12px;font-size:13px;display:none;box-shadow:0 10px 24px rgba(0,0,0,.2);}
    .hint{font-size:12px;color:var(--muted);padding:0 16px 16px;}
  </style>

  <script>
    const I18N = {
      zh:{appName:"翱翔安居 · XATU", appDesc:"收藏", title:"收藏", sub:"这里显示你收藏的房源", login:"登录", en:"EN", empty:"暂无收藏（或尚未登录）", remove:"取消收藏"},
      en:{appName:"AoXiang Housing · XATU", appDesc:"Favorites", title:"Favorites", sub:"Your saved listings", login:"Login", en:"ZH", empty:"No favorites (or not logged in).", remove:"Remove"}
    };
    function getLang(){return localStorage.getItem("lang")||"zh";}
    function setLang(l){localStorage.setItem("lang",l);document.documentElement.dataset.lang=l;applyI18n();}
    function t(k){return (I18N[getLang()]&&I18N[getLang()][k])||I18N.zh[k]||k;}
    function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>el.style.display="none",2200);}
    function goBack(){ if(history.length>1) history.back(); else location.href="/"; }

    function getSupabase(){
      const cfg=window.APP_CONFIG||{};
      if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY) return null;
      return window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    }
    function applyI18n(){
      document.getElementById("appName").textContent=t("appName");
      document.getElementById("appDesc").textContent=t("appDesc");
      document.getElementById("pageTitle").textContent=t("title");
      document.getElementById("pageSub").textContent=t("sub");
      document.getElementById("btnLang").textContent=t("en");
      document.getElementById("btnLogin").textContent=t("login");
    }
    function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}

    async function loadFavorites(){
      const listEl=document.getElementById("list");
      listEl.innerHTML = `<div class="hint">Loading…</div>`;

      const sb=getSupabase();
      if(!sb){ listEl.innerHTML=`<div class="hint">⚠️ 未配置 Supabase（assets/config.js）</div>`; return; }

      const { data: sessionData } = await sb.auth.getSession();
      const uid = sessionData?.session?.user?.id;
      if(!uid){
        listEl.innerHTML = `<div class="hint">${t("empty")}</div>`;
        return;
      }

      // favorites 表一般结构：user_id, listing_id
      // 这里用 join：select favorites + listings(*)
      const { data, error } = await sb
        .from("favorites")
        .select("id, listing_id, listings(*)")
        .eq("user_id", uid)
        .order("created_at", { ascending:false });

      if(error){
        listEl.innerHTML = `<div class="hint">⚠️ 读取 favorites 失败：${error.message}</div>`;
        return;
      }
      if(!data || data.length===0){
        listEl.innerHTML = `<div class="hint">${t("empty")}</div>`;
        return;
      }

      listEl.innerHTML="";
      data.forEach(f=>{
        const row = f.listings || {};
        const title=row.title||"Untitled";
        const price=row.price??"";
        const loc=row.location||"";
        const contact=row.contact||"";
        const el=document.createElement("div");
        el.className="item";
        el.innerHTML=`
          <div>
            <p class="title">${esc(title)}</p>
            <div class="meta">
              ${price!==""?`<span class="badge">¥${esc(String(price))}</span>`:""}
              ${row.campus?`<span class="badge">${esc(row.campus)}</span>`:""}
              ${row.rent_type?`<span class="badge">${esc(row.rent_type)}</span>`:""}
              ${row.bathroom?`<span class="badge">${esc(row.bathroom)}</span>`:""}
            </div>
            ${loc?`<p class="desc">${esc(loc)}</p>`:""}
          </div>
          <div class="right">
            <button class="btn" data-remove>🗑 ${t("remove")}</button>
            <button class="btn primary" data-contact>📎 Contact</button>
          </div>
        `;

        el.querySelector("[data-contact]").onclick=()=>{
          if(contact){
            navigator.clipboard?.writeText(contact);
            toast("已复制联系方式");
          }else toast("该房源未填写联系方式");
        };

        el.querySelector("[data-remove]").onclick=async ()=>{
          const { error: delErr } = await sb.from("favorites").delete().eq("id", f.id);
          if(delErr) toast("取消失败");
          else { toast("已取消"); loadFavorites(); }
        };

        listEl.appendChild(el);
      });
    }

    function bindCommon(){
      document.getElementById("btnBack").onclick=goBack;
      document.getElementById("btnLang").onclick=()=>setLang(getLang()==="zh"?"en":"zh");
      document.getElementById("btnLogin").onclick=()=>toast("登录入口已保留（下一步接 Supabase Auth）");

      document.getElementById("tabHome").onclick=()=>location.href="/";
      document.getElementById("tabSubmit").onclick=()=>location.href="/submit";
      document.getElementById("tabFav").onclick=()=>location.href="/favorites";
      document.getElementById("tabSupport").onclick=()=>location.href="/support";
    }

    window.addEventListener("DOMContentLoaded", ()=>{
      document.documentElement.dataset.lang=getLang();
      applyI18n();
      bindCommon();
      document.querySelector('[data-tab="fav"]').classList.add("active");
      loadFavorites();
    });
  </script>
</head>

<body>
  <div class="topbar">
    <div class="inner">
      <button class="back" id="btnBack" title="Back">←</button>
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
        <div>
          <div class="t1" id="appName">翱翔安居 · XATU</div>
          <div class="t2" id="appDesc">收藏</div>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="btnLang">EN</button>
      <button class="btn primary" id="btnLogin">登录</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="hd">
        <h1 class="h1" id="pageTitle">收藏</h1>
        <p class="sub" id="pageSub">这里显示你收藏的房源</p>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <div class="tabs">
      <a class="tab" data-tab="home" id="tabHome"><div class="ic">🏠</div><div>租房</div></a>
      <a class="tab" data-tab="submit" id="tabSubmit"><div class="ic">➕</div><div>发布</div></a>
      <a class="tab active" data-tab="fav" id="tabFav"><div class="ic">⭐</div><div>收藏</div></a>
      <a class="tab" data-tab="support" id="tabSupport"><div class="ic">💬</div><div>客服</div></a>
    </div>
  </div>
</body>
</html>
