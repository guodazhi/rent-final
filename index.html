<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>翱翔安居 · XATU</title>

  <!-- ✅ 每个页面都要加的脚本（放在 head） -->
  <script src="assets/config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --text:#111827; --muted:#6b7280;
      --line:#e5e7eb; --pri:#2563eb; --pri2:#1d4ed8; --shadow:0 10px 30px rgba(17,24,39,.08);
      --r:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:980px;margin:0 auto;padding:18px 14px 90px}
    .topbar{
      position:sticky;top:0;z-index:20;
      backdrop-filter:saturate(180%) blur(10px);
      background:rgba(246,247,251,.85);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{max-width:980px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
    .btn-ghost{
      border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;color:var(--text)
    }
    .btn-ghost:hover{border-color:#cbd5e1}
    .brand{display:flex;align-items:center;gap:10px;min-width:260px}
    .logo{
      width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);display:block;object-fit:cover;
    }
    .brand h1{margin:0;font-size:14px;line-height:1.1}
    .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
    .sp{flex:1}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:12px;cursor:pointer}
    .chip:hover{border-color:#cbd5e1}
    .btn{
      border:1px solid transparent;background:var(--pri);color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;
      font-weight:600
    }
    .btn:hover{background:var(--pri2)}
    .hero{padding:18px 0 10px}
    .hero h2{margin:0 0 6px;font-size:22px}
    .hero .sub{color:var(--muted);font-size:13px}
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      box-shadow:var(--shadow);padding:14px;margin-top:12px
    }
    .grid{display:grid;gap:12px}
    @media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
    .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    .field select,.field input{
      width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none
    }
    .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
    .row .btn{padding:10px 14px}
    .hint{margin-top:10px;color:var(--muted);font-size:12px}
    .warn{margin-top:10px;color:#b45309;font-size:12px;display:flex;gap:8px;align-items:center}
    .list{margin-top:14px;display:grid;gap:12px}
    @media(min-width:860px){.list{grid-template-columns:repeat(2,1fr)}}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
      padding:14px;display:flex;flex-direction:column;gap:8px
    }
    .card .t{display:flex;align-items:center;gap:10px}
    .card .title{font-weight:700}
    .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:999px;background:#fff}
    .meta{display:flex;flex-wrap:wrap;gap:8px}
    .price{font-weight:800}
    .actions{display:flex;gap:10px;margin-top:6px}
    .btn-lite{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}
    .btn-lite:hover{border-color:#cbd5e1}
    .nav{
      position:fixed;left:0;right:0;bottom:0;z-index:50;
      background:#fff;border-top:1px solid var(--line)
    }
    .nav-inner{max-width:980px;margin:0 auto;display:flex}
    .nav a{
      flex:1;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted);
      display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center
    }
    .nav a.active{color:var(--pri);font-weight:700}
    .ico{font-size:16px;line-height:1}
    /* login modal */
    .modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:60}
    .modal{width:min(520px,92vw);background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:14px}
    .modal h3{margin:6px 0 10px}
    .modal .two{display:grid;gap:10px}
    @media(min-width:640px){.modal .two{grid-template-columns:1fr 1fr}}
    .modal .x{float:right;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
    .small{font-size:12px;color:var(--muted)}
    .ok{color:#065f46}
    .err{color:#b91c1c}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <button class="btn-ghost" id="btnBack" title="返回">
        ← <span data-i18n="back">返回</span>
      </button>

      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
        <div>
          <h1>翱翔安居 · XATU</h1>
          <p data-i18n="subtitle">西安工业大学学生租房平台</p>
        </div>
      </div>

      <div class="sp"></div>

      <button class="chip" id="btnMe">👤 <span data-i18n="me">我的</span></button>
      <button class="chip" id="btnLang">EN</button>
      <button class="btn" id="btnLogin" data-i18n="login">登录</button>
    </div>
  </div>

  <div class="wrap">
    <div class="hero">
      <h2 data-i18n="browse">租房浏览</h2>
      <div class="sub" data-i18n="browse_sub">筛选房源 · 收藏 · 一键联系</div>
    </div>

    <div class="panel">
      <div class="grid">
        <div class="field">
          <label data-i18n="campus">校区</label>
          <select id="fCampus">
            <option value="" data-i18n="all">全部</option>
            <option value="友谊校区">友谊校区</option>
            <option value="未央校区">未央校区</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="rent_type">整租/合租</label>
          <select id="fRentType">
            <option value="" data-i18n="all">全部</option>
            <option value="整租">整租</option>
            <option value="合租">合租</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="bathroom">独卫/公卫</label>
          <select id="fBath">
            <option value="" data-i18n="all">全部</option>
            <option value="独卫">独卫</option>
            <option value="公卫">公卫</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="metro">地铁</label>
          <select id="fMetro">
            <option value="" data-i18n="all">全部</option>
            <option value="近地铁">近地铁</option>
            <option value="不限">不限</option>
          </select>
        </div>

        <div class="field" style="grid-column:1/-1">
          <label data-i18n="kw">搜索</label>
          <input id="fKw" placeholder="校区/整租/独卫/地铁/关键词…" />
        </div>
      </div>

      <div class="row">
        <button class="btn" id="btnSearch" data-i18n="search">搜索</button>
        <button class="btn-lite" id="btnClear" data-i18n="clear">清空</button>
        <div class="hint" id="dataHint"></div>
      </div>

      <div class="warn" id="warnBox" style="display:none">⚠️ <span id="warnText"></span></div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <div class="nav">
    <div class="nav-inner">
      <a class="active" href="./index.html"><div class="ico">🏠</div><div data-i18n="nav_browse">租房</div></a>
      <a href="./submit.html"><div class="ico">➕</div><div data-i18n="nav_submit">发布</div></a>
      <a href="./favorites.html"><div class="ico">⭐</div><div data-i18n="nav_fav">收藏</div></a>
      <a href="./support.html"><div class="ico">💬</div><div data-i18n="nav_support">客服</div></a>
    </div>
  </div>

  <!-- Login modal -->
  <div class="modal-mask" id="mask">
    <div class="modal">
      <button class="x" id="closeMask">✕</button>
      <h3 data-i18n="login_title">登录 / 注册</h3>
      <div class="small" data-i18n="login_tip">
        建议：先用邮箱+密码快速跑通（手机短信 OTP 以后再加）
      </div>

      <div class="two" style="margin-top:10px">
        <div class="field">
          <label>Email</label>
          <input id="authEmail" placeholder="name@example.com" />
        </div>
        <div class="field">
          <label data-i18n="password">密码</label>
          <input id="authPass" type="password" placeholder="********" />
        </div>

        <div class="field">
          <label data-i18n="realname">姓名（可选）</label>
          <input id="pName" placeholder="张三" />
        </div>
        <div class="field">
          <label data-i18n="student_id">学号（可选）</label>
          <input id="pStudentId" placeholder="2026xxxx" />
        </div>

        <div class="field" style="grid-column:1/-1">
          <label data-i18n="phone">手机号（可选）</label>
          <input id="pPhone" placeholder="仅保存，不验证" />
        </div>
      </div>

      <div class="row" style="margin-top:10px">
        <button class="btn" id="doSignIn" data-i18n="signin">登录</button>
        <button class="btn-lite" id="doSignUp" data-i18n="signup">注册</button>
        <button class="btn-lite" id="doSignOut" data-i18n="signout">退出</button>
      </div>

      <div class="small" id="authMsg" style="margin-top:8px"></div>
    </div>
  </div>

  <script>
    // ---------- i18n ----------
    const I18N = {
      zh: {
        back:"返回", subtitle:"西安工业大学学生租房平台",
        me:"我的", login:"登录",
        browse:"租房浏览", browse_sub:"筛选房源 · 收藏 · 一键联系",
        campus:"校区", rent_type:"整租/合租", bathroom:"独卫/公卫", metro:"地铁",
        all:"全部", kw:"搜索", search:"搜索", clear:"清空",
        nav_browse:"租房", nav_submit:"发布", nav_fav:"收藏", nav_support:"客服",
        login_title:"登录 / 注册", login_tip:"建议：先用邮箱+密码快速跑通（手机短信 OTP 以后再加）",
        password:"密码", realname:"姓名（可选）", student_id:"学号（可选）", phone:"手机号（可选）",
        signin:"登录", signup:"注册", signout:"退出",
        need_cfg:"未配置 Supabase：请先填写 assets/config.js",
        fetch_fail:"读取 listings 失败：",
        need_login:"需要登录后使用此功能",
        fav:"收藏", unfav:"取消收藏", contact:"联系",
        copied:"已复制联系方式：",
        empty:"暂无数据（可能还没发布房源，或都在待审核）"
      },
      en: {
        back:"Back", subtitle:"XATU Student Rental Platform",
        me:"Me", login:"Login",
        browse:"Browse Rentals", browse_sub:"Filter · Favorite · Contact",
        campus:"Campus", rent_type:"Rent Type", bathroom:"Bathroom", metro:"Metro",
        all:"All", kw:"Search", search:"Search", clear:"Clear",
        nav_browse:"Browse", nav_submit:"Post", nav_fav:"Favorites", nav_support:"Support",
        login_title:"Login / Sign up", login_tip:"Tip: use Email+Password first (SMS OTP later).",
        password:"Password", realname:"Name (optional)", student_id:"Student ID (optional)", phone:"Phone (optional)",
        signin:"Sign in", signup:"Sign up", signout:"Sign out",
        need_cfg:"Supabase not configured: fill assets/config.js first.",
        fetch_fail:"Failed to load listings: ",
        need_login:"Please login first.",
        fav:"Favorite", unfav:"Unfavorite", contact:"Contact",
        copied:"Copied contact: ",
        empty:"No data yet."
      }
    };
    const LANG_KEY = "xatu_lang";
    function getLang(){ return localStorage.getItem(LANG_KEY) || "zh"; }
    function setLang(v){ localStorage.setItem(LANG_KEY, v); applyI18n(); }
    function t(k){ return (I18N[getLang()]||I18N.zh)[k] || k; }
    function applyI18n(){
      document.documentElement.lang = getLang()==="en" ? "en" : "zh-CN";
      document.getElementById("btnLang").textContent = getLang()==="en" ? "CN" : "EN";
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      // placeholders
      document.getElementById("fKw").placeholder = getLang()==="en" ? "campus / rent / bathroom / metro / keywords..." : "校区/整租/独卫/地铁/关键词…";
    }

    // ---------- supabase ----------
    function cfgOk(){
      return window.APP_CONFIG
        && typeof window.APP_CONFIG.SUPABASE_URL==="string"
        && window.APP_CONFIG.SUPABASE_URL.startsWith("http")
        && typeof window.APP_CONFIG.SUPABASE_ANON_KEY==="string"
        && window.APP_CONFIG.SUPABASE_ANON_KEY.length>20;
    }
    const sb = cfgOk() ? supabase.createClient(
      window.APP_CONFIG.SUPABASE_URL,
      window.APP_CONFIG.SUPABASE_ANON_KEY
    ) : null;

    // ---------- UI helpers ----------
    const warnBox = document.getElementById("warnBox");
    const warnText = document.getElementById("warnText");
    function showWarn(msg){
      warnText.textContent = msg;
      warnBox.style.display = "flex";
    }
    function hideWarn(){ warnBox.style.display="none"; }
    function back(){
      if (history.length>1) history.back();
      else location.href="./index.html";
    }

    // ---------- auth modal ----------
    const mask = document.getElementById("mask");
    function openAuth(){ mask.style.display="flex"; }
    function closeAuth(){ mask.style.display="none"; }
    document.getElementById("btnLogin").onclick = openAuth;
    document.getElementById("btnMe").onclick = openAuth;
    document.getElementById("closeMask").onclick = closeAuth;
    mask.addEventListener("click",(e)=>{ if(e.target===mask) closeAuth(); });

    async function upsertProfile(userId){
      if(!sb) return;
      const name = document.getElementById("pName").value.trim();
      const student_id = document.getElementById("pStudentId").value.trim();
      const phone = document.getElementById("pPhone").value.trim();
      const payload = { id:userId };
      if(name) payload.name = name;
      if(student_id) payload.student_id = student_id;
      if(phone) payload.phone = phone;

      // role default student (SQL 已给 default 'student')
      await sb.from("profiles").upsert(payload, { onConflict:"id" });
    }

    function setAuthMsg(text, cls){
      const el=document.getElementById("authMsg");
      el.className="small "+(cls||"");
      el.textContent=text||"";
    }

    document.getElementById("doSignUp").onclick = async ()=>{
      if(!sb) return showWarn(t("need_cfg"));
      hideWarn(); setAuthMsg("");
      try{
        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPass").value;
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(data?.user?.id) await upsertProfile(data.user.id);
        setAuthMsg("OK: sign up success (check email if confirmation is enabled).", "ok");
      }catch(e){
        setAuthMsg("ERR: "+(e.message||e), "err");
      }
    };

    document.getElementById("doSignIn").onclick = async ()=>{
      if(!sb) return showWarn(t("need_cfg"));
      hideWarn(); setAuthMsg("");
      try{
        const email = document.getElementById("authEmail").value.trim();
        const password = document.getElementById("authPass").value;
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        if(data?.user?.id) await upsertProfile(data.user.id);
        setAuthMsg("OK: signed in", "ok");
        await refreshAuthUI();
        closeAuth();
        await loadListings();
      }catch(e){
        setAuthMsg("ERR: "+(e.message||e), "err");
      }
    };

    document.getElementById("doSignOut").onclick = async ()=>{
      if(!sb) return;
      await sb.auth.signOut();
      setAuthMsg("OK: signed out", "ok");
      await refreshAuthUI();
      await loadListings();
    };

    async function refreshAuthUI(){
      if(!sb){
        document.getElementById("btnLogin").textContent = t("login");
        return;
      }
      const { data } = await sb.auth.getUser();
      const user = data?.user;
      const btn = document.getElementById("btnLogin");
      if(user){
        btn.textContent = (getLang()==="en" ? "Logged" : "已登录");
      }else{
        btn.textContent = t("login");
      }
    }

    // ---------- listings ----------
    function buildCard(row, favSet){
      const el = document.createElement("div");
      el.className = "card";

      const title = row.title || (getLang()==="en" ? "Listing" : "房源");
      const campus = row.campus || "-";
      const rent_type = row.rent_type || "-";
      const bathroom = row.bathroom || "-";
      const metro = row.metro || "-";
      const price = row.price ?? "-";
      const locationTxt = row.location || "";

      const isFav = favSet.has(String(row.id));

      el.innerHTML = `
        <div class="t">
          <div class="title">${escapeHtml(title)}</div>
          <div class="sp"></div>
          <div class="tag">${escapeHtml(campus)}</div>
        </div>
        <div class="meta">
          <span class="tag">${escapeHtml(rent_type)}</span>
          <span class="tag">${escapeHtml(bathroom)}</span>
          <span class="tag">${escapeHtml(metro)}</span>
        </div>
        <div class="t">
          <div class="price">¥ ${escapeHtml(String(price))}</div>
          <div class="sp"></div>
          <div class="small">${escapeHtml(locationTxt)}</div>
        </div>
        <div class="actions">
          <button class="btn-lite" data-act="fav">${isFav ? "⭐ "+t("unfav") : "☆ "+t("fav")}</button>
          <button class="btn" data-act="contact">☎ ${t("contact")}</button>
        </div>
      `;

      el.querySelector('[data-act="contact"]').onclick = ()=>{
        const contact = row.contact || row.contact_info || row.wechat || "";
        if(!contact){
          alert(getLang()==="en" ? "No contact info." : "暂无联系方式");
          return;
        }
        navigator.clipboard?.writeText(contact);
        alert(t("copied")+contact);
      };

      el.querySelector('[data-act="fav"]').onclick = async ()=>{
        if(!sb) return showWarn(t("need_cfg"));
        const { data } = await sb.auth.getUser();
        if(!data?.user) return alert(t("need_login"));
        const uid = data.user.id;

        const listingId = row.id;
        if(isFav){
          await sb.from("favorites").delete().eq("user_id", uid).eq("listing_id", listingId);
        }else{
          await sb.from("favorites").insert({ user_id: uid, listing_id: listingId });
        }
        await loadListings();
      };

      return el;
    }

    function escapeHtml(s){
      return String(s||"").replace(/[&<>"']/g,(m)=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function filters(){
      return {
        campus: document.getElementById("fCampus").value,
        rent_type: document.getElementById("fRentType").value,
        bathroom: document.getElementById("fBath").value,
        metro: document.getElementById("fMetro").value,
        kw: document.getElementById("fKw").value.trim()
      };
    }

    async function loadFavoritesSet(){
      const set = new Set();
      if(!sb) return set;
      const { data } = await sb.auth.getUser();
      const user = data?.user;
      if(!user) return set;

      const { data: favs } = await sb.from("favorites").select("listing_id").eq("user_id", user.id);
      (favs||[]).forEach(x=>set.add(String(x.listing_id)));
      return set;
    }

    async function loadListings(){
      const list = document.getElementById("list");
      list.innerHTML = "";
      hideWarn();

      if(!sb){
        showWarn(t("need_cfg"));
        return;
      }

      document.getElementById("dataHint").textContent = (getLang()==="en")
        ? "(data from Supabase · listings)"
        : "（数据来自 Supabase · listings）";

      try{
        const f = filters();
        let q = sb.from("listings").select("*").order("created_at", { ascending:false }).limit(50);

        // 如果你库里有审核字段（比如 status / approved），优先只取已通过
        // 不存在也没关系，Supabase 会报错 → 我们忽略
        // 这里不强依赖字段，后面会 fallback
        // （保持简单：先取全表，靠 RLS 控制）
        if(f.campus) q = q.eq("campus", f.campus);
        if(f.rent_type) q = q.eq("rent_type", f.rent_type);
        if(f.bathroom) q = q.eq("bathroom", f.bathroom);
        if(f.metro) q = q.eq("metro", f.metro);

        const { data, error } = await q;
        if(error) throw error;

        // keyword 前端过滤（避免依赖全文索引）
        const kw = f.kw;
        let rows = data || [];
        if(kw){
          const k = kw.toLowerCase();
          rows = rows.filter(r=>{
            const s = [
              r.title,r.location,r.description,r.campus,r.rent_type,r.bathroom,r.metro
            ].join(" ").toLowerCase();
            return s.includes(k);
          });
        }

        const favSet = await loadFavoritesSet();
        if(!rows.length){
          const empty = document.createElement("div");
          empty.className="panel";
          empty.textContent = t("empty");
          list.appendChild(empty);
          return;
        }

        rows.forEach(r=>list.appendChild(buildCard(r, favSet)));
      }catch(e){
        showWarn(t("fetch_fail") + (e.message||e));
      }
    }

    // ---------- events ----------
    document.getElementById("btnBack").onclick = back;
    document.getElementById("btnLang").onclick = ()=> setLang(getLang()==="en" ? "zh" : "en");
    document.getElementById("btnSearch").onclick = loadListings;
    document.getElementById("btnClear").onclick = ()=>{
      document.getElementById("fCampus").value="";
      document.getElementById("fRentType").value="";
      document.getElementById("fBath").value="";
      document.getElementById("fMetro").value="";
      document.getElementById("fKw").value="";
      loadListings();
    };

    // init
    applyI18n();
    refreshAuthUI();
    loadListings();
  </script>
</body>
</html>
