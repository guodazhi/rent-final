<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>翱翔安居 · XATU</title>
  <link rel="icon" href="favicon.ico"/>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <!-- ✅头像/Logo：用你仓库原来的文件，不替换 -->
      < img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      <span data-i18n="brand"></span>
    </div>
    <button class="lang" id="langBtn"></button>
  </div>

  <div class="wrap">
    <div class="small" data-i18n="suggestWeChat"></div>
    <div class="h1" data-i18n="homeTitle"></div>

    <div class="row">
      <select class="input" id="campus">
        <option value="" data-i18n="filterAll"></option>
        <option value="友谊校区">友谊校区</option>
        <option value="长安校区">长安校区</option>
        <option value="未央校区">未央校区</option>
      </select>

      <select class="input" id="rentType">
        <option value="" data-i18n="filterAll"></option>
        <option value="整租">整租</option>
        <option value="合租">合租</option>
      </select>

      <select class="input" id="bathroom">
        <option value="" data-i18n="filterAll"></option>
        <option value="独卫">独卫</option>
        <option value="公卫">公卫</option>
      </select>

      <select class="input" id="subway">
        <option value="" data-i18n="filterAll"></option>
        <option value="近地铁">近地铁</option>
        <option value="不限">不限</option>
      </select>
    </div>

    <div class="row">
      <input class="input" id="q" data-i18n-placeholder="searchPlaceholder" placeholder=""/>
      <button class="btn btnPrimary" id="btnSearch" data-i18n="btnSearch"></button>
      <button class="btn" id="btnClear" data-i18n="btnClear"></button>
    </div>

    <div id="listingGrid" class="grid"></div>
  </div>

  <div class="nav">
    <a class="active" href=" "><div>🏠</div><div data-i18n="navRent"></div></a >
    <a href="submit.html"><div>➕</div><div data-i18n="navSubmit"></div></a >
    <a href="favorites.html"><div>⭐</div><div data-i18n="navFav"></div></a >
    <a href="support.html"><div>💬</div><div data-i18n="navSupport"></div></a >
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
  <script>
    I18N_HELPER.applyI18n();
    document.getElementById("langBtn").onclick = ()=>{
      I18N_HELPER.setLang(I18N_HELPER.getLang()==="zh"?"en":"zh");
    };
    document.getElementById("btnSearch").onclick = ()=>APP.loadListings();
    document.getElementById("btnClear").onclick = ()=>{
      ["campus","rentType","bathroom","subway","q"].forEach(id=>document.getElementById(id).value="");
      APP.loadListings();
    };
    APP.loadListings();
  </script>
</body>
</html>
