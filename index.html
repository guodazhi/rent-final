<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>翱翔安居 · XATU</title>

<style>
:root{
  --main:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:800px;
  margin:auto;
  padding:16px;
}
.header{
  background:linear-gradient(90deg,#e0f2fe,#dbeafe);
  padding:16px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:20px;
  font-weight:700;
}
.lang-btn{
  background:white;
  border:none;
  padding:6px 12px;
  border-radius:12px;
  cursor:pointer;
}
.title{
  margin-top:20px;
  font-size:32px;
  font-weight:800;
}
.tag{
  margin-top:12px;
  background:#e5e7eb;
  padding:8px 14px;
  border-radius:20px;
  display:inline-block;
}
.search{
  margin-top:14px;
}
.search input{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid #ddd;
}
.cards{
  margin-top:20px;
  display:grid;
  gap:14px;
}
.card{
  background:var(--card);
  padding:14px;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #ddd;
}
.bottom-nav a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🐨 翱翔安居 · XATU</div>
    <button class="lang-btn" onclick="toggleLang()">EN</button>
  </div>

  <div class="title" id="mainTitle">
    西安工业大学学生租房平台
  </div>

  <div class="tag" id="campusTag">
    西安工业大学（友谊校区）
  </div>

  <div class="search">
    <input id="searchBox" placeholder="搜索：校区 / 整租 / 独卫 / 地铁..." />
  </div>

  <div class="cards" id="listingContainer">
    <!-- 房源会加载到这里 -->
  </div>

</div>

<div class="bottom-nav">
  <a href=" " id="navHome">租房</a >
  <a href="submit.html" id="navPost">发布</a >
  <a href="approved.html" id="navFav">收藏</a >
  <a href="admin.html" id="navService">客服</a >
</div>

<script>

let currentLang = "zh";

function toggleLang(){
  if(currentLang === "zh"){
    currentLang = "en";
    document.documentElement.lang="en";
    document.getElementById("mainTitle").innerText =
      "Xi'an Technological University Student Housing Platform";
    document.getElementById("campusTag").innerText =
      "XATU (Youyi Campus)";
    document.getElementById("searchBox").placeholder =
      "Search: campus / whole rent / metro / private bath...";
    document.getElementById("navHome").innerText="Home";
    document.getElementById("navPost").innerText="Post";
    document.getElementById("navFav").innerText="Approved";
    document.getElementById("navService").innerText="Admin";
  }else{
    currentLang = "zh";
    document.documentElement.lang="zh";
    document.getElementById("mainTitle").innerText =
      "西安工业大学学生租房平台";
    document.getElementById("campusTag").innerText =
      "西安工业大学（友谊校区）";
    document.getElementById("searchBox").placeholder =
      "搜索：校区 / 整租 / 独卫 / 地铁...";
    document.getElementById("navHome").innerText="租房";
    document.getElementById("navPost").innerText="发布";
    document.getElementById("navFav").innerText="收藏";
    document.getElementById("navService").innerText="客服";
  }
}

async function loadListings(){
  try{
    const res = await fetch("/.netlify/functions/getApproved");
    const data = await res.json();
    const container = document.getElementById("listingContainer");
    container.innerHTML="";

    data.forEach(item=>{
      const div=document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <h3>${item.title}</h3>
        <p>¥${item.price}</p >
        <p>${item.location || ""}</p >
        <p>${item.contact || ""}</p >
      `;
      container.appendChild(div);
    });
  }catch(err){
    console.error(err);
  }
}

loadListings();

</script>

</body>
</html>
