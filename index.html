<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>翱翔安居 · XATU</title>
  <meta name="description" content="西安工业大学学生租房平台" />
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --brand:#2563eb;
      --brand2:#0ea5e9;
      --shadow: 0 10px 30px rgba(17,24,39,.08);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, rgba(37,99,235,.10), transparent 60%),
                  radial-gradient(900px 500px at 95% 0%, rgba(14,165,233,.10), transparent 55%),
                  var(--bg);
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      border:1px solid rgba(229,231,235,.8);
      border-radius: 18px;
      padding:12px 14px;
      box-shadow: var(--shadow);
      position:sticky; top:10px; z-index:20;
    }
    .brand{
      display:flex;align-items:center;gap:10px;min-width:200px;
    }
    .brand img{
      width:38px;height:38px;border-radius:12px;object-fit:cover;
      border:1px solid rgba(229,231,235,.9);
      background:#fff;
    }
    .brand .t1{font-weight:800;letter-spacing:.2px}
    .brand .t2{font-size:12px;color:var(--muted);margin-top:2px}
    .right{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;
    }
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid rgba(229,231,235,.9);
      background:#fff;
      padding:9px 11px;border-radius:999px;
      box-shadow: 0 6px 18px rgba(17,24,39,.05);
      font-size:14px;
    }
    .pill select,.pill button{
      border:none;background:transparent;font:inherit;outline:none;cursor:pointer;
      color:var(--text);
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 12px;border-radius:12px;border:1px solid rgba(229,231,235,.9);
      background:#fff;cursor:pointer;
      box-shadow: 0 6px 18px rgba(17,24,39,.05);
      font-weight:600;
    }
    .btn.primary{
      border:none;
      color:#fff;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 12px 26px rgba(37,99,235,.25);
    }

    .hero{
      margin-top:16px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:14px;
      align-items:stretch;
    }
    .panel{
      background:rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      border:1px solid rgba(229,231,235,.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:16px;
    }
    .h1{font-size:26px; font-weight:900; margin:0 0 6px}
    .sub{color:var(--muted); margin:0 0 14px; line-height:1.4}
    .searchRow{
      display:flex;gap:10px;flex-wrap:wrap;
    }
    .input{
      flex:1; min-width:220px;
      display:flex;align-items:center;gap:10px;
      border:1px solid rgba(229,231,235,.9);
      background:#fff;border-radius:14px;
      padding:10px 12px;
    }
    .input input{
      border:none;outline:none;width:100%;
      font-size:15px;
    }
    .grid2{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap:10px;
      margin-top:10px;
    }
    .select{
      display:flex;align-items:center;gap:10px;
      border:1px solid rgba(229,231,235,.9);
      background:#fff;border-radius:14px;
      padding:10px 12px;
    }
    .select select{
      border:none;outline:none;background:transparent;font:inherit;width:100%;
    }

    details.more{
      margin-top:10px;
      border:1px dashed rgba(229,231,235,.9);
      border-radius:14px;
      padding:10px 12px;
      background: rgba(255,255,255,.55);
    }
    details.more summary{
      cursor:pointer;
      color:var(--muted);
      font-weight:600;
      user-select:none;
    }

    .side{
      display:flex;flex-direction:column;gap:10px;
    }
    .hint{
      display:flex;flex-direction:column;gap:6px;
      padding:14px;
      border-radius: var(--radius);
      border:1px solid rgba(229,231,235,.8);
      background: linear-gradient(180deg, rgba(255,255,255,.80), rgba(255,255,255,.65));
      box-shadow: var(--shadow);
    }
    .hint b{font-size:14px}
    .hint span{color:var(--muted);font-size:13px;line-height:1.45}

    .sectionHead{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin-top:16px;margin-bottom:10px;
    }
    .sectionHead .title{font-size:16px;font-weight:900}
    .sectionHead .meta{color:var(--muted);font-size:13px}

    .cards{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap:12px;
    }
    .card{
      background:rgba(255,255,255,.85);
      border:1px solid rgba(229,231,235,.85);
      border-radius: 16px;
      padding:14px;
      box-shadow: 0 10px 26px rgba(17,24,39,.06);
      transition: transform .12s ease, box-shadow .12s ease;
      overflow:hidden;
    }
    .card:hover{transform: translateY(-2px); box-shadow: 0 16px 34px rgba(17,24,39,.10);}
    .tagRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .tag{
      font-size:12px;
      padding:6px 8px;
      border-radius:999px;
      border:1px solid rgba(229,231,235,.9);
      background:#fff;
      color:#111827;
    }
    .price{font-size:20px;font-weight:900;margin:0 0 6px}
    .line{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .mini{
      padding:9px 10px;border-radius:12px;border:1px solid rgba(229,231,235,.9);
      background:#fff;cursor:pointer;font-weight:700;font-size:13px;
    }
    .mini.primary{
      border:none;color:#fff;background: linear-gradient(135deg,var(--brand),var(--brand2));
    }

    .empty{
      background:rgba(255,255,255,.70);
      border:1px dashed rgba(229,231,235,.9);
      border-radius:16px;
      padding:16px;
      color:var(--muted);
      text-align:center;
    }

    .bottomNav{
      position:fixed;left:0;right:0;bottom:0;
      background:rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border-top:1px solid rgba(229,231,235,.9);
      padding:10px 12px;
      z-index:50;
    }
    .bottomNav .inner{
      max-width:1100px;margin:0 auto;
      display:flex;justify-content:space-around;gap:10px;
      font-size:13px;
    }
    .navItem{
      display:flex;flex-direction:column;align-items:center;gap:6px;
      color:var(--muted);
      min-width:70px;
    }
    .navItem.active{color:var(--brand);font-weight:900}
    .dot{
      width:6px;height:6px;border-radius:999px;background:transparent;
    }
    .navItem.active .dot{background:var(--brand)}

    @media (max-width: 900px){
      .hero{grid-template-columns:1fr}
      .cards{grid-template-columns:1fr}
      .brand{min-width:auto}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="brand">
        <!-- 只用一个 Logo：assets/logo.png -->
        <img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
        <div>
          <div class="t1" id="ui_brand">翱翔安居 · XATU</div>
          <div class="t2" id="ui_brand_sub">学生租房 · 真实发布 · 审核展示</div>
        </div>
      </div>

      <div class="right">
        <div class="pill">
          <span id="ui_lang">语言</span>
          <select id="lang">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>

        <a class="btn" href="submit.html" id="ui_nav_submit">发布</a>
        <a class="btn" href="approved.html" id="ui_nav_approved">已通过</a>
        <a class="btn" href="admin.html" id="ui_nav_admin">后台</a>
      </div>
    </div>

    <!-- Hero -->
    <div class="hero">
      <div class="panel">
        <h1 class="h1" id="ui_h1">西安工业大学学生租房平台</h1>
        <p class="sub" id="ui_sub">输入关键词快速找房；常用筛选保持极简，更多条件可展开。</p>

        <div class="searchRow">
          <div class="input">
            <span>🔎</span>
            <input id="q" placeholder="搜索：校区 / 整租 / 独卫 / 地铁..." />
          </div>
          <button class="btn primary" id="btnSearch">搜索</button>
          <button class="btn" id="btnReset">清空</button>
        </div>

        <div class="grid2">
          <div class="select">
            <span>📍</span>
            <select id="campus">
              <option value="" id="ui_opt_all_campus">全部校区</option>
              <option value="友谊">友谊校区</option>
              <option value="未央">未央校区</option>
              <option value="金花">金花校区</option>
              <option value="其他">其他/附近</option>
            </select>
          </div>

          <div class="select">
            <span>🏠</span>
            <select id="type">
              <option value="" id="ui_opt_all_type">全部类型</option>
              <option value="整租">整租</option>
              <option value="合租">合租</option>
              <option value="主卧">主卧</option>
              <option value="次卧">次卧</option>
            </select>
          </div>
        </div>

        <details class="more">
          <summary id="ui_more">更多筛选（可选）</summary>
          <div class="grid2" style="margin-top:10px;">
            <div class="select">
              <span>💰</span>
              <select id="priceRange">
                <option value="">不限价格</option>
                <option value="0-800">0 - 800</option>
                <option value="800-1200">800 - 1200</option>
                <option value="1200-2000">1200 - 2000</option>
                <option value="2000-99999">2000+</option>
              </select>
            </div>
            <div class="select">
              <span>📞</span>
              <select id="contactType">
                <option value="">不限联系</option>
                <option value="微信">微信</option>
                <option value="电话">电话</option>
                <option value="WeChat">WeChat</option>
                <option value="Phone">Phone</option>
              </select>
            </div>
          </div>
        </details>
      </div>

      <div class="side">
        <div class="hint">
          <b id="ui_hint1_t">提交后会进入审核</b>
          <span id="ui_hint1_d">发布的房源先进入 Pending，管理员通过后才会在“已通过”展示。</span>
        </div>
        <div class="hint">
          <b id="ui_hint2_t">建议：信息写清楚</b>
          <span id="ui_hint2_d">标题写“校区+户型+亮点”，描述写清“费用/押金/最短租期/可看房时间”。</span>
        </div>
      </div>
    </div>

    <!-- List -->
    <div class="sectionHead">
      <div class="title" id="ui_list_title">最新房源</div>
      <div class="meta" id="ui_list_meta">自动加载中…</div>
    </div>

    <div id="list" class="cards"></div>
    <div id="empty" class="empty" style="display:none;"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottomNav">
    <div class="inner">
      <a class="navItem active" href="index.html"><div class="dot"></div><div id="ui_tab_home">租房</div></a>
      <a class="navItem" href="submit.html"><div class="dot"></div><div id="ui_tab_submit">发布</div></a>
      <a class="navItem" href="approved.html"><div class="dot"></div><div id="ui_tab_star">收藏</div></a>
      <a class="navItem" href="admin.html"><div class="dot"></div><div id="ui_tab_help">客服</div></a>
    </div>
  </div>

  <script>
    // ====== CONFIG ======
    const API_LISTINGS = "/.netlify/functions/listings"; // 如果你函数路径不同，改这里

    // ====== I18N ======
    const I18N = {
      zh: {
        brand: "翱翔安居 · XATU",
        brandSub: "学生租房 · 真实发布 · 审核展示",
        lang: "语言",
        navSubmit: "发布",
        navApproved: "已通过",
        navAdmin: "后台",
        h1: "西安工业大学学生租房平台",
        sub: "输入关键词快速找房；常用筛选保持极简，更多条件可展开。",
        qPH: "搜索：校区 / 整租 / 独卫 / 地铁...",
        search: "搜索",
        reset: "清空",
        allCampus: "全部校区",
        allType: "全部类型",
        more: "更多筛选（可选）",
        listTitle: "最新房源",
        loading: "自动加载中…",
        empty: "暂无数据。你可以调整筛选或先去发布一个房源。",
        hint1t: "提交后会进入审核",
        hint1d: "发布的房源先进入 Pending，管理员通过后才会在“已通过”展示。",
        hint2t: "建议：信息写清楚",
        hint2d: "标题写“校区+户型+亮点”，描述写清“费用/押金/最短租期/可看房时间”。",
        tabHome: "租房",
        tabSubmit: "发布",
        tabStar: "收藏",
        tabHelp: "客服",
        view: "查看",
        contact: "联系"
      },
      en: {
        brand: "AoXiang Housing · XATU",
        brandSub: "Student rentals · Post & review · Approved listings",
        lang: "Language",
        navSubmit: "Post",
        navApproved: "Approved",
        navAdmin: "Admin",
        h1: "XATU Student Rental Platform",
        sub: "Search fast with keywords. Keep filters minimal; expand for more options.",
        qPH: "Search: campus / whole rent / ensuite / metro...",
        search: "Search",
        reset: "Reset",
        allCampus: "All campuses",
        allType: "All types",
        more: "More filters (optional)",
        listTitle: "Latest listings",
        loading: "Loading…",
        empty: "No results. Try different filters, or post a new listing first.",
        hint1t: "Submission goes to review",
        hint1d: "New posts go to Pending. After admin approval, they appear in Approved.",
        hint2t: "Tip: write clearly",
        hint2d: "Title: campus + room type + highlight. Description: price/deposit/min lease/viewing time.",
        tabHome: "Rent",
        tabSubmit: "Post",
        tabStar: "Saved",
        tabHelp: "Support",
        view: "View",
        contact: "Contact"
      }
    };

    const $ = (id) => document.getElementById(id);

    function setLang(lang){
      const t = I18N[lang] || I18N.zh;
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      $("ui_brand").textContent = t.brand;
      $("ui_brand_sub").textContent = t.brandSub;
      $("ui_lang").textContent = t.lang;
      $("ui_nav_submit").textContent = t.navSubmit;
      $("ui_nav_approved").textContent = t.navApproved;
      $("ui_nav_admin").textContent = t.navAdmin;
      $("ui_h1").textContent = t.h1;
      $("ui_sub").textContent = t.sub;
      $("q").placeholder = t.qPH;
      $("btnSearch").textContent = t.search;
      $("btnReset").textContent = t.reset;
      $("ui_opt_all_campus").textContent = t.allCampus;
      $("ui_opt_all_type").textContent = t.allType;
      $("ui_more").textContent = t.more;
      $("ui_list_title").textContent = t.listTitle;
      $("ui_list_meta").textContent = t.loading;
      $("ui_hint1_t").textContent = t.hint1t;
      $("ui_hint1_d").textContent = t.hint1d;
      $("ui_hint2_t").textContent = t.hint2t;
      $("ui_hint2_d").textContent = t.hint2d;
      $("ui_tab_home").textContent = t.tabHome;
      $("ui_tab_submit").textContent = t.tabSubmit;
      $("ui_tab_star").textContent = t.tabStar;
      $("ui_tab_help").textContent = t.tabHelp;

      localStorage.setItem("lang", lang);
      // 语言切换后重新渲染按钮文本
      renderCachedButtonsText(lang);
    }

    function renderCachedButtonsText(lang){
      const t = I18N[lang] || I18N.zh;
      document.querySelectorAll("[data-i18n-view]").forEach(el => el.textContent = t.view);
      document.querySelectorAll("[data-i18n-contact]").forEach(el => el.textContent = t.contact);
    }

    // ====== DATA ======
    function buildQuery(){
      const q = $("q").value.trim();
      const campus = $("campus").value.trim();
      const type = $("type").value.trim();
      const priceRange = $("priceRange").value.trim();
      const contactType = $("contactType").value.trim();

      let min_price = "", max_price = "";
      if (priceRange && priceRange.includes("-")){
        const [a,b] = priceRange.split("-");
        min_price = a; max_price = b;
      }

      const params = new URLSearchParams();
      if (q) params.set("q", q);
      if (campus) params.set("campus", campus);
      if (type) params.set("type", type);
      if (contactType) params.set("contact_type", contactType);
      if (min_price) params.set("min_price", min_price);
      if (max_price) params.set("max_price", max_price);

      return params.toString();
    }

    function formatPrice(n){
      if (n === null || n === undefined) return "";
      const num = Number(n);
      if (Number.isFinite(num)) return "$" + num.toString();
      return String(n);
    }

    function normalizeItem(x){
      // 兼容你函数返回字段名不一致的情况
      return {
        id: x.id,
        title: x.title ?? x.name ?? "",
        price: x.price ?? "",
        location: x.location ?? x.campus ?? "",
        contact: x.contact ?? x.phone ?? x.wechat ?? "",
        description: x.description ?? "",
      };
    }

    function cardHTML(item, lang){
      const t = I18N[lang] || I18N.zh;
      const title = item.title || (lang==="en" ? "Untitled" : "未命名");
      const loc = item.location || (lang==="en" ? "Location not set" : "未填写位置");
      const contact = item.contact || (lang==="en" ? "Contact not set" : "未填写联系方式");

      const tags = [];
      if (item.location) tags.push(item.location);
      if (item.description) tags.push((lang==="en" ? "Details" : "详情"));
      // tags 最多 2 个，避免复杂
      const tagHTML = tags.slice(0,2).map(s => `<span class="tag">${escapeHTML(s)}</span>`).join("");

      return `
        <div class="card">
          <div class="tagRow">${tagHTML}</div>
          <p class="price">${formatPrice(item.price)}</p>
          <p class="line"><b>${escapeHTML(title)}</b></p>
          <p class="line">📍 ${escapeHTML(loc)}</p>
          <p class="line">📞 ${escapeHTML(contact)}</p>
          <div class="actions">
            <button class="mini primary" data-i18n-view onclick="alert('${lang==="en" ? "Open approved page to view details (extend later)." : "详情页可后续扩展：目前先在已通过页查看。"}')">${t.view}</button>
            <button class="mini" data-i18n-contact onclick="copyText('${escapeJS(item.contact)}')">${t.contact}</button>
          </div>
        </div>
      `;
    }

    function escapeHTML(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function escapeJS(str){
      return String(str ?? "").replaceAll("\\","\\\\").replaceAll("'","\\'");
    }
    function copyText(text){
      if(!text){ alert("空"); return; }
      navigator.clipboard.writeText(text).then(()=>alert("已复制: " + text)).catch(()=>alert("复制失败"));
    }

    async function load(){
      const lang = $("lang").value;
      const t = I18N[lang] || I18N.zh;

      $("ui_list_meta").textContent = t.loading;
      $("empty").style.display = "none";
      $("list").innerHTML = "";

      const qs = buildQuery();
      const url = qs ? `${API_LISTINGS}?${qs}` : API_LISTINGS;

      try{
        const res = await fetch(url, { headers: { "Accept": "application/json" }});
        if(!res.ok){
          const txt = await res.text();
          throw new Error("HTTP " + res.status + " " + txt);
        }
        const data = await res.json();

        const arr = Array.isArray(data) ? data : (data.items || data.data || []);
        const items = arr.map(normalizeItem);

        $("ui_list_meta").textContent = (lang==="en")
          ? `${items.length} result(s)`
          : `共 ${items.length} 条`;

        if(!items.length){
          $("empty").textContent = t.empty;
          $("empty").style.display = "block";
          return;
        }

        $("list").innerHTML = items.map(it => cardHTML(it, lang)).join("");
        renderCachedButtonsText(lang);
      }catch(e){
        $("ui_list_meta").textContent = (lang==="en") ? "Load failed" : "加载失败";
        $("empty").textContent = (lang==="en")
          ? ("Error: " + e.message)
          : ("错误：" + e.message);
        $("empty").style.display = "block";
      }
    }

    // ====== EVENTS ======
    $("btnSearch").addEventListener("click", load);
    $("btnReset").addEventListener("click", ()=>{
      $("q").value = "";
      $("campus").value = "";
      $("type").value = "";
      $("priceRange").value = "";
      $("contactType").value = "";
      load();
    });
    $("lang").addEventListener("change", ()=>{
      setLang($("lang").value);
      load();
    });

    // init
    (function init(){
      const saved = localStorage.getItem("lang") || "zh";
      $("lang").value = saved;
      setLang(saved);
      load();
    })();
  </script>
</body>
</html>
