<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Approved Listings</title>
</head>
<body>
  <h1>Approved Listings</h1>
  <button onclick="loadListings()">Refresh</button>
  <div id="output">Loading...</div>

  <script>
    async function loadListings() {
      document.getElementById("output").innerText = "Loading...";

      try {
        const res = await fetch("/.netlify/functions/listings");
        const data = await res.json();

        if (!Array.isArray(data)) {
          document.getElementById("output").innerText = "Unexpected response";
          return;
        }

        if (data.length === 0) {
          document.getElementById("output").innerText = "No listings found.";
          return;
        }

        let html = "";
        data.forEach(item => {
          html += `
            <div style="border:1px solid #ccc;margin:10px;padding:10px;">
              <h3>${item.title || "No title"}</h3>
              <p>${item.description || ""}</p >
            </div>
          `;
        });

        document.getElementById("output").innerHTML = html;

      } catch (err) {
        document.getElementById("output").innerText = "Error loading listings.";
      }
    }

    loadListings();
  </script>
</body>
</html>
