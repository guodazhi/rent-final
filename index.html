<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>翱翔安居 · XATU</title>

  <!-- ✅ 每个页面都要加：配置 + Supabase SDK -->
  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffffcc;
      --card2:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#2563eb;
      --shadow: 0 10px 30px rgba(17,24,39,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC","Microsoft Yahei", sans-serif;
      background: radial-gradient(1200px 600px at 15% 0%, #eaf2ff 0%, transparent 55%),
                  radial-gradient(900px 500px at 85% 10%, #e9fff2 0%, transparent 50%),
                  var(--bg);
      color:var(--text);
      padding-bottom:74px;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:980px; margin:0 auto; padding:18px 16px 24px;}
    .topbar{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(246,248,251,.92), rgba(246,248,251,.72));
      border-bottom:1px solid var(--line);
    }
    .topbar .inner{max-width:980px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px;}
    .brand{
      display:flex; align-items:center; gap:10px; min-width:240px;
    }
    .logo{
      width:34px; height:34px; border-radius:10px; object-fit:cover;
      background:#fff; border:1px solid var(--line);
    }
    .brand .t1{font-weight:800; font-size:14px; line-height:1.1}
    .brand .t2{font-size:12px; color:var(--muted)}
    .spacer{flex:1}
    .btn{
      border:1px solid var(--line);
      background:#fff;
      padding:8px 12px;
      border-radius:12px;
      font-size:13px;
      cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn.primary{background:var(--primary); color:#fff; border-color:transparent;}
    .btn:active{transform: translateY(1px);}
    .pill{
      border:1px solid var(--line); background:#fff; border-radius:999px;
      padding:7px 10px; font-size:12px; color:var(--muted);
      display:inline-flex; align-items:center; gap:8px;
    }
    .back{
      width:38px; height:38px; border-radius:12px;
      border:1px solid var(--line); background:#fff; cursor:pointer;
      display:grid; place-items:center;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:14px;
    }
    .card{
      background: var(--card);
      border:1px solid rgba(229,231,235,.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card .hd{
      padding:16px 16px 10px;
    }
    .h1{font-size:22px; font-weight:900; margin:0;}
    .sub{margin:6px 0 0; color:var(--muted); font-size:13px}
    .filters{padding:14px 16px 16px;}
    .row{display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;}
    @media (max-width:860px){ .row{grid-template-columns: 1fr 1fr;} }
    @media (max-width:520px){ .row{grid-template-columns: 1fr;} .brand{min-width:auto;} }
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px;}
    select, input{
      width:100%;
      padding:11px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      outline:none;
      font-size:14px;
    }
    .actions{display:flex; gap:10px; margin-top:12px; align-items:center;}
    .hint{font-size:12px; color:var(--muted)}
    .list{padding:0 16px 16px;}
    .item{
      background: var(--card2);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px 14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-top:10px;
    }
    .badge{
      font-size:12px;
      border:1px solid var(--line);
      background:#f9fafb;
      padding:4px 8px;
      border-radius:999px;
      color:var(--muted);
      white-space:nowrap;
    }
    .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
    .title{font-weight:800; margin:0; font-size:15px;}
    .desc{margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.4;}
    .right{margin-left:auto; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
    .mini{
      font-size:12px; color:var(--muted);
    }
    .tabbar{
      position:fixed; left:0; right:0; bottom:0;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      border-top:1px solid var(--line);
      padding:10px 12px;
      z-index:20;
    }
    .tabs{max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
    .tab{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px;
      padding:7px 6px;
      border-radius:14px;
      border:1px solid transparent;
      color:var(--muted);
      font-size:12px;
    }
    .tab.active{background:#eef2ff; border-color:#dbeafe; color:#1d4ed8; font-weight:800;}
    .tab .ic{font-size:16px; line-height:1;}
    .toast{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:84px; z-index:50;
      background:#111827; color:#fff;
      padding:10px 12px; border-radius:12px;
      font-size:13px;
      display:none;
      box-shadow: 0 10px 24px rgba(0,0,0,.2);
    }
  </style>

  <script>
    // ===== 通用：i18n + 路由 + 轻提示 =====
    const I18N = {
      zh: {
        appName: "翱翔安居 · XATU",
        appDesc: "西安工业大学学生租房平台",
        browse: "租房浏览",
        browseSub: "筛选房源 · 收藏 · 一键联系",
        campus: "校区",
        type: "整租/合租",
        bath: "独卫/公卫",
        metro: "地铁",
        keyword: "搜索",
        keywordPh: "校区/整租/独卫/地铁/关键词...",
        search: "搜索",
        clear: "清空",
        loading: "加载中…",
        empty: "暂无房源（或尚未审核通过）",
        fav: "收藏",
        unfav: "取消收藏",
        contact: "一键联系",
        login: "登录",
        me: "我的",
        en: "EN",
      },
      en: {
        appName: "AoXiang Housing · XATU",
        appDesc: "Student housing platform for XATU",
        browse: "Browse Listings",
        browseSub: "Filter · Favorite · One-click contact",
        campus: "Campus",
        type: "Rent Type",
        bath: "Bathroom",
        metro: "Metro",
        keyword: "Search",
        keywordPh: "campus/type/bath/metro/keywords...",
        search: "Search",
        clear: "Clear",
        loading: "Loading…",
        empty: "No listings yet (or not approved).",
        fav: "Favorite",
        unfav: "Unfavorite",
        contact: "Contact",
        login: "Login",
        me: "Me",
        en: "ZH",
      }
    };

    function getLang(){
      return localStorage.getItem("lang") || document.documentElement.dataset.lang || "zh";
    }
    function setLang(lang){
      localStorage.setItem("lang", lang);
      document.documentElement.dataset.lang = lang;
      applyI18n();
    }
    function t(key){
      const lang = getLang();
      return (I18N[lang] && I18N[lang][key]) || (I18N.zh[key] || key);
    }
    function toast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(()=> el.style.display="none", 2200);
    }

    // ===== 通用：返回键（没历史就回首页）=====
    function goBack(){
      if (history.length > 1) history.back();
      else location.href = "/";
    }

    // ===== Supabase 初始化（从 assets/config.js 读取）=====
    function getSupabase(){
      const cfg = window.APP_CONFIG || {};
      const url = cfg.SUPABASE_URL;
      const key = cfg.SUPABASE_ANON_KEY;
      if(!url || !key){
        return null;
      }
      return window.supabase.createClient(url, key);
    }

    // ===== 通用：高亮底部 Tab =====
    function setActiveTab(name){
      document.querySelectorAll("[data-tab]").forEach(el=>{
        el.classList.toggle("active", el.dataset.tab === name);
      });
    }

    // ===== 通用：i18n 应用到 DOM =====
    function applyI18n(){
      document.getElementById("appName").textContent = t("appName");
      document.getElementById("appDesc").textContent = t("appDesc");
      document.getElementById("pageTitle").textContent = t("browse");
      document.getElementById("pageSub").textContent = t("browseSub");
      document.getElementById("labCampus").textContent = t("campus");
      document.getElementById("labType").textContent = t("type");
      document.getElementById("labBath").textContent = t("bath");
      document.getElementById("labMetro").textContent = t("metro");
      document.getElementById("labKeyword").textContent = t("keyword");
      document.getElementById("q").placeholder = t("keywordPh");
      document.getElementById("btnSearch").textContent = t("search");
      document.getElementById("btnClear").textContent = t("clear");
      document.getElementById("btnLang").textContent = t("en");
      document.getElementById("btnLogin").textContent = t("login");
    }

    // ===== 仅首页：加载 listings（容错：字段缺失也能展示）=====
    async function loadListings(){
      const listEl = document.getElementById("list");
      listEl.innerHTML = `<div class="hint">${t("loading")}</div>`;

      const sb = getSupabase();
      if(!sb){
        listEl.innerHTML = `<div class="hint">⚠️ 未配置 SUPABASE_URL / SUPABASE_ANON_KEY（assets/config.js）</div>`;
        return;
      }

      const campus = document.getElementById("campus").value;
      const rentType = document.getElementById("rent_type").value;
      const bathroom = document.getElementById("bathroom").value;
      const metro = document.getElementById("metro").value;
      const q = document.getElementById("q").value.trim();

      // 你库里大概率有 public.listings（从截图里看到了 listings 表）
      let query = sb.from("listings").select("*").limit(50);

      // 如果你有 status/approved 字段，这两行你可以按实际改：
      // query = query.eq("status","approved");
      // 或 query = query.eq("approved", true);

      // 容错过滤：字段不存在会报错 → 我们 catch 后退回不筛选
      try{
        if(campus && campus !== "all") query = query.eq("campus", campus);
        if(rentType && rentType !== "all") query = query.eq("rent_type", rentType);
        if(bathroom && bathroom !== "all") query = query.eq("bathroom", bathroom);
        if(metro && metro !== "all") query = query.eq("metro", metro);

        if(q){
          // 这里用 or + ilike，字段不存在也可能报错，放在 try 内
          query = query.or(
            `title.ilike.%${q}%,location.ilike.%${q}%,description.ilike.%${q}%`
          );
        }
      }catch(e){
        console.warn("filter build failed:", e);
      }

      const { data, error } = await query.order("created_at", { ascending:false });
      if(error){
        listEl.innerHTML = `<div class="hint">⚠️ 读取 listings 失败：${error.message}</div>`;
        return;
      }
      if(!data || data.length===0){
        listEl.innerHTML = `<div class="hint">${t("empty")}</div>`;
        return;
      }

      listEl.innerHTML = "";
      data.forEach(row=>{
        const title = row.title || row.name || "Untitled";
        const price = row.price ?? row.rent ?? "";
        const loc = row.location || row.address || "";
        const desc = row.description || "";
        const campusVal = row.campus || "";
        const typeVal = row.rent_type || "";
        const bathVal = row.bathroom || "";
        const metroVal = row.metro || "";
        const contact = row.contact || row.phone || row.wechat || "";

        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div>
            <p class="title">${escapeHtml(title)}</p>
            <div class="meta">
              ${price!=="" ? `<span class="badge">¥${escapeHtml(String(price))}</span>` : ``}
              ${campusVal? `<span class="badge">${escapeHtml(campusVal)}</span>`:``}
              ${typeVal? `<span class="badge">${escapeHtml(typeVal)}</span>`:``}
              ${bathVal? `<span class="badge">${escapeHtml(bathVal)}</span>`:``}
              ${metroVal? `<span class="badge">${escapeHtml(metroVal)}</span>`:``}
            </div>
            ${loc ? `<p class="desc">${escapeHtml(loc)}</p>` : ``}
            ${desc ? `<p class="desc">${escapeHtml(desc)}</p>` : ``}
          </div>
          <div class="right">
            <button class="btn" data-action="fav">⭐ ${t("fav")}</button>
            <button class="btn primary" data-action="contact">${t("contact")}</button>
            ${contact? `<div class="mini">${escapeHtml(contact)}</div>`: `<div class="mini"> </div>`}
          </div>
        `;

        el.querySelector('[data-action="contact"]').addEventListener("click", ()=>{
          if(contact){
            navigator.clipboard?.writeText(contact);
            toast(`已复制联系方式：${contact}`);
          }else{
            toast("此房源未填写联系方式");
          }
        });

        el.querySelector('[data-action="fav"]').addEventListener("click", async ()=>{
          // 收藏：如果你有 favorites 表（截图里有 favorites）
          const sb2 = getSupabase();
          const { data: sessionData } = await sb2.auth.getSession();
          const uid = sessionData?.session?.user?.id;
          if(!uid){
            toast("请先登录后收藏");
            return;
          }
          const listingId = row.id;
          if(!listingId){
            toast("该房源缺少 id，无法收藏");
            return;
          }
          const { error: favErr } = await sb2.from("favorites").insert({ user_id: uid, listing_id: listingId });
          if(favErr){
            // 如果已存在会报冲突，这里简单提示
            toast("收藏失败/可能已收藏");
          }else{
            toast("已收藏");
          }
        });

        listEl.appendChild(el);
      });
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function bindCommon(){
      // 语言按钮
      document.getElementById("btnLang").addEventListener("click", ()=>{
        setLang(getLang()==="zh" ? "en" : "zh");
      });

      // 登录按钮（先做跳转到 /support 也行，你后面要做 login.html 再改）
      document.getElementById("btnLogin").addEventListener("click", async ()=>{
        // 这里不强行弹窗，避免破坏你已有登录实现
        toast("登录入口已保留（下一步接入 Supabase Auth）");
      });

      // tab 跳转
      document.getElementById("tabHome").addEventListener("click", ()=> location.href="/");
      document.getElementById("tabSubmit").addEventListener("click", ()=> location.href="/submit");
      document.getElementById("tabFav").addEventListener("click", ()=> location.href="/favorites");
      document.getElementById("tabSupport").addEventListener("click", ()=> location.href="/support");

      // 返回
      document.getElementById("btnBack").addEventListener("click", goBack);
    }

    window.addEventListener("DOMContentLoaded", ()=>{
      // 初始化语言
      document.documentElement.dataset.lang = getLang();
      applyI18n();
      bindCommon();
      setActiveTab("home");

      document.getElementById("btnSearch").addEventListener("click", loadListings);
      document.getElementById("btnClear").addEventListener("click", ()=>{
        document.getElementById("campus").value="all";
        document.getElementById("rent_type").value="all";
        document.getElementById("bathroom").value="all";
        document.getElementById("metro").value="all";
        document.getElementById("q").value="";
        loadListings();
      });

      loadListings();
    });
  </script>
</head>

<body>
  <div class="topbar">
    <div class="inner">
      <button class="back" id="btnBack" title="Back">←</button>

      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
        <div>
          <div class="t1" id="appName">翱翔安居 · XATU</div>
          <div class="t2" id="appDesc">西安工业大学学生租房平台</div>
        </div>
      </div>

      <div class="spacer"></div>

      <span class="pill">👤 <span id="meLabel">我的</span></span>
      <button class="btn" id="btnLang">EN</button>
      <button class="btn primary" id="btnLogin">登录</button>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card">
        <div class="hd">
          <h1 class="h1" id="pageTitle">租房浏览</h1>
          <p class="sub" id="pageSub">筛选房源 · 收藏 · 一键联系</p>
        </div>

        <div class="filters">
          <div class="row">
            <div>
              <label id="labCampus">校区</label>
              <select id="campus">
                <option value="all">全部</option>
                <option value="友谊校区">友谊校区</option>
                <option value="未央校区">未央校区</option>
                <option value="金花校区">金花校区</option>
              </select>
            </div>
            <div>
              <label id="labType">整租/合租</label>
              <select id="rent_type">
                <option value="all">全部</option>
                <option value="整租">整租</option>
                <option value="合租">合租</option>
              </select>
            </div>
            <div>
              <label id="labBath">独卫/公卫</label>
              <select id="bathroom">
                <option value="all">全部</option>
                <option value="独卫">独卫</option>
                <option value="公卫">公卫</option>
              </select>
            </div>
            <div>
              <label id="labMetro">地铁</label>
              <select id="metro">
                <option value="all">全部</option>
                <option value="近地铁">近地铁</option>
                <option value="不限">不限</option>
              </select>
            </div>
          </div>

          <div style="margin-top:10px;">
            <label id="labKeyword">搜索</label>
            <input id="q" placeholder="校区/整租/独卫/地铁/关键词..." />
          </div>

          <div class="actions">
            <button class="btn primary" id="btnSearch">搜索</button>
            <button class="btn" id="btnClear">清空</button>
            <span class="hint">（数据来自 Supabase · listings）</span>
          </div>
        </div>

        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <div class="tabs">
      <a class="tab active" data-tab="home" id="tabHome"><div class="ic">🏠</div><div>租房</div></a>
      <a class="tab" data-tab="submit" id="tabSubmit"><div class="ic">➕</div><div>发布</div></a>
      <a class="tab" data-tab="fav" id="tabFav"><div class="ic">⭐</div><div>收藏</div></a>
      <a class="tab" data-tab="support" id="tabSupport"><div class="ic">💬</div><div>客服</div></a>
    </div>
  </div>
</body>
</html>
