<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>发布房源 · 翱翔安居 XATU</title>

  <script src="/assets/config.js"></script>
  <link rel="stylesheet" href="/assets/app.css" />
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <div class="container pad-bottom">
    <div class="shell">
      <div class="topbar">
        <a class="backbtn" href=" " aria-label="back">← 返回</a >

        <div class="brand">
          < img src="/assets/logo.png" alt="logo" />
          <div>
            <div class="title">翱翔安居 · XATU</div>
            <div class="sub">发布房源（提交后进入待审核）</div>
          </div>
        </div>

        <div class="actions">
          <a class="pill" href="/favorites.html">⭐ <small>收藏</small></a >
          <a class="pill" href="/support.html">💬 <small>客服</small></a >
        </div>
      </div>

      <div class="header">
        <div class="h1">发布房源</div>
        <div class="h2">请填写真实信息，提交后进入待审核</div>
      </div>

      <div class="card filters">
        <div class="grid" style="grid-template-columns: 2fr 1fr 1fr; gap:12px">
          <div class="field">
            <label>标题 / Title</label>
            <input id="title" placeholder="e.g. 主卧 / Master Room" />
          </div>
          <div class="field">
            <label>价格 / Price</label>
            <input id="price" placeholder="e.g. 800" />
          </div>
          <div class="field">
            <label>位置 / Location</label>
            <input id="location" placeholder="e.g. 校门口 / 友谊校区附近" />
          </div>
        </div>

        <div class="grid" style="margin-top:12px">
          <div class="field">
            <label>联系方式 / Contact</label>
            <input id="contact" placeholder="e.g. WeChat / Phone" />
          </div>
          <div class="field">
            <label>校区 / Campus</label>
            <select id="campus">
              <option>友谊校区</option>
              <option>未央校区</option>
              <option>金花校区</option>
            </select>
          </div>
          <div class="field">
            <label>整租/合租</label>
            <select id="rent_type">
              <option>整租</option>
              <option>合租</option>
            </select>
          </div>
          <div class="field">
            <label>独卫/公卫</label>
            <select id="bath_type">
              <option>独卫</option>
              <option>公卫</option>
            </select>
          </div>
          <div class="field">
            <label>地铁</label>
            <select id="subway">
              <option>近地铁</option>
              <option>不近地铁</option>
            </select>
          </div>
          <div class="field" style="grid-column:1 / -1">
            <label>描述（可选）</label>
            <textarea id="description" placeholder="房型、朝向、楼层、是否可短租、押金方式、照片链接等…"></textarea>
          </div>
        </div>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="btnSubmit">提交</button>
          <div class="badge">提交后进入待审核，审核通过后展示在首页。</div>
        </div>

        <div class="notice" id="msg" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="inner">
      <a class="tab" href="/"><div class="dot">🏠</div><div>租房</div></a >
      <a class="tab active" href="/submit.html"><div class="dot">＋</div><div>发布</div></a >
      <a class="tab" href="/favorites.html"><div class="dot">⭐</div><div>收藏</div></a >
      <a class="tab" href="/support.html"><div class="dot">💬</div><div>客服</div></a >
    </div>
  </div>

  <script>
    (async function(){
      const { XATU } = window;
      await XATU.auth.setSessionFromUrlIfPresent();

      const msg = document.getElementById("msg");
      const btn = document.getElementById("btnSubmit");

      btn.onclick = async () => {
        XATU.ui.setNotice(msg, "", "notice");

        const payload = {
          title: document.getElementById("title").value.trim(),
          price: Number(document.getElementById("price").value.trim() || 0),
          location: document.getElementById("location").value.trim(),
          contact: document.getElementById("contact").value.trim(),
          campus: document.getElementById("campus").value,
          rent_type: document.getElementById("rent_type").value,
          bath_type: document.getElementById("bath_type").value,
          subway: document.getElementById("subway").value,
          description: document.getElementById("description").value.trim() || null,
          status: "pending"
        };

        if(!payload.title || !payload.location || !payload.contact || !payload.price){
          XATU.ui.setNotice(msg, "请至少填写：标题、价格、位置、联系方式", "err");
          return;
        }

        try{
          btn.disabled = true;
          await XATU.listings.create(payload);
          XATU.ui.setNotice(msg, "提交成功：已进入待审核。", "ok");
          setTimeout(()=> location.href="/", 700);
        }catch(e){
          XATU.ui.setNotice(msg, "提交失败：" + e.message + "（请检查 listings 表 insert policy / RLS）", "err");
        }finally{
          btn.disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
