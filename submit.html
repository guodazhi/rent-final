<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Submit Listing</title>
  <link rel="icon" href="favicon.ico"/>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      < img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      <span data-i18n="brand"></span>
    </div>
    <button class="lang" id="langBtn"></button>
  </div>

  <div class="wrap">
    <div class="h1" data-i18n="submitTitle"></div>

    <form id="f">
      <div class="row">
        <input class="input" id="title" data-i18n-placeholder="formTitle" placeholder="">
        <input class="input" id="price" type="number" data-i18n-placeholder="formPrice" placeholder="">
      </div>
      <div class="row">
        <input class="input" id="location" data-i18n-placeholder="formLocation" placeholder="">
        <input class="input" id="contact" data-i18n-placeholder="formContact" placeholder="">
      </div>

      <div class="row">
        <select class="input" id="campus">
          <option value="">校区 / Campus</option>
          <option value="友谊校区">友谊校区</option>
          <option value="长安校区">长安校区</option>
          <option value="未央校区">未央校区</option>
        </select>
        <select class="input" id="rentType">
          <option value="">整租/合租</option>
          <option value="整租">整租</option>
          <option value="合租">合租</option>
        </select>
      </div>

      <div class="row">
        <select class="input" id="bathroom">
          <option value="">独卫/公卫</option>
          <option value="独卫">独卫</option>
          <option value="公卫">公卫</option>
        </select>
        <select class="input" id="subway">
          <option value="">地铁</option>
          <option value="近地铁">近地铁</option>
          <option value="不限">不限</option>
        </select>
      </div>

      <textarea class="input" id="description" rows="4" data-i18n-placeholder="formDesc" placeholder=""></textarea>

      <div class="row">
        <button class="btn btnPrimary" type="submit" data-i18n="btnSubmit"></button>
      </div>

      <div id="status" class="hint"></div>
      <div class="small">* 提交后进入待审核，审核通过后会出现在首页。</div>
    </form>
  </div>

  <div class="nav">
    <a href=" "><div>🏠</div><div data-i18n="navRent"></div></a >
    <a class="active" href="submit.html"><div>➕</div><div data-i18n="navSubmit"></div></a >
    <a href="favorites.html"><div>⭐</div><div data-i18n="navFav"></div></a >
    <a href="support.html"><div>💬</div><div data-i18n="navSupport"></div></a >
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
  <script>
    I18N_HELPER.applyI18n();
    document.getElementById("langBtn").onclick = ()=>{
      I18N_HELPER.setLang(I18N_HELPER.getLang()==="zh"?"en":"zh");
    };
    document.getElementById("f").addEventListener("submit", APP.submitListing);
  </script>
</body>
</html>
