<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>支持中心 / Support</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 920px; margin: 24px auto; padding: 0 14px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    input, select, textarea, button { padding:10px; font-size:14px; }
    input, select, textarea { width: 100%; box-sizing: border-box; }
    textarea { min-height: 120px; }
    .card { border:1px solid #e5e5e5; border-radius:10px; padding:12px; margin:10px 0; }
    .muted { color:#666; font-size:13px; }
    .ok { color: #0a7; font-weight:600; }
    .err { color: #c00; font-weight:600; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #ddd; margin-left:6px; font-size:12px; }
    .topbar { display:flex; gap:10px; align-items:center; }
    .btn { cursor:pointer; }
  </style>
</head>
<body>
<header>
  <div>
    <h2 id="h_title">支持中心</h2>
    <div class="muted" id="h_sub">提交反馈/报修/举报，并查看处理进度</div>
  </div>
  <div class="topbar">
    <button class="btn" id="btnLang">EN</button>
    <button class="btn" id="btnLogin">Login</button>
    <button class="btn" id="btnLogout" style="display:none;">Logout</button>
  </div>
</header>

<hr/>

<div class="card">
  <h3 id="form_title">提交工单</h3>
  <div class="row">
    <div style="flex:1; min-width:160px;">
      <label class="muted" id="lbl_type">类型</label>
      <select id="type">
        <option value="feedback">反馈 Feedback</option>
        <option value="repair">报修 Repair</option>
        <option value="report">举报 Report</option>
        <option value="complaint">投诉 Complaint</option>
      </select>
    </div>
    <div style="flex:1; min-width:160px;">
      <label class="muted" id="lbl_priority">优先级</label>
      <select id="priority">
        <option value="low">低 Low</option>
        <option value="normal" selected>普通 Normal</option>
        <option value="high">高 High</option>
      </select>
    </div>
    <div style="flex:1; min-width:220px;">
      <label class="muted" id="lbl_listing">房源ID（可选）</label>
      <input id="listing_id" placeholder="UUID (optional)" />
    </div>
  </div>

  <div class="row" style="margin-top:10px;">
    <div style="flex:1; min-width:220px;">
      <label class="muted" id="lbl_title">标题</label>
      <input id="title" placeholder="简短说明 / Short title" />
    </div>
  </div>

  <div style="margin-top:10px;">
    <label class="muted" id="lbl_content">内容</label>
    <textarea id="content" placeholder="请详细描述..."></textarea>
  </div>

  <div style="margin-top:10px;">
    <button class="btn" id="btnSubmit">提交</button>
    <span id="msg" class="muted"></span>
  </div>
</div>

<div class="card">
  <h3 id="my_title">我的工单</h3>
  <div class="muted" id="my_sub">需要登录后查看</div>
  <div id="list"></div>
</div>

<script>
  // ==== i18n ====
  const i18n = {
    zh: {
      h_title: "支持中心",
      h_sub: "提交反馈/报修/举报，并查看处理进度",
      form_title: "提交工单",
      lbl_type: "类型",
      lbl_priority: "优先级",
      lbl_listing: "房源ID（可选）",
      lbl_title: "标题",
      lbl_content: "内容",
      btnSubmit: "提交",
      my_title: "我的工单",
      my_sub: "需要登录后查看",
      login: "登录",
      logout: "退出",
      needLogin: "请先登录",
      submitted: "已提交，等待处理",
      failed: "提交失败："
    },
    en: {
      h_title: "Support Center",
      h_sub: "Submit feedback/repair/report and track status",
      form_title: "Create Ticket",
      lbl_type: "Type",
      lbl_priority: "Priority",
      lbl_listing: "Listing ID (optional)",
      lbl_title: "Title",
      lbl_content: "Content",
      btnSubmit: "Submit",
      my_title: "My Tickets",
      my_sub: "Login required to view",
      login: "Login",
      logout: "Logout",
      needLogin: "Please login first",
      submitted: "Submitted. Waiting for processing",
      failed: "Submission failed: "
    }
  };
  let lang = localStorage.getItem('lang') || 'zh';
  function applyLang() {
    const t = i18n[lang];
    for (const k in t) {
      const el = document.getElementById(k);
      if (el) el.textContent = t[k];
    }
    document.getElementById('btnLang').textContent = (lang === 'zh') ? 'EN' : '中文';
    document.documentElement.lang = lang;
  }

  // ==== supabase ====
  const SUPABASE_URL = window.SUPABASE_URL || ''; // optional
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || ''; // optional

  // 如果你没有在 window 注入，就直接用 Netlify 环境变量渲染不了（静态页），
  // 所以这里改为：从你现有页面里复制 supabase url/key 填进来（只需一次）。
  // 你如果之前 submit.html 已经能写入 listings，说明你那里已有 supabase 初始化方式。
  //
  // 最稳做法：把下面两行换成你项目里已经在用的 supabaseUrl/supabaseAnonKey。
  const supabaseUrl = SUPABASE_URL || "YOUR_SUPABASE_URL";
  const supabaseAnonKey = SUPABASE_ANON_KEY || "YOUR_SUPABASE_ANON_KEY";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

  async function getToken() {
    const { data } = await supabase.auth.getSession();
    return data?.session?.access_token || null;
  }

  async function refreshAuthUI() {
    const token = await getToken();
    document.getElementById('btnLogin').style.display = token ? 'none' : '';
    document.getElementById('btnLogout').style.display = token ? '' : 'none';
    document.getElementById('my_sub').textContent = token ? '' : i18n[lang].my_sub;
    if (token) await loadMy();
  }

  async function quickLogin() {
    // 极简登录：弹窗输入 email + password（你后续要做实名/学号/手机号注册可以再升级）
    const email = prompt('Email:');
    if (!email) return;
    const password = prompt('Password:');
    if (!password) return;

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
    await refreshAuthUI();
  }

  async function logout() {
    await supabase.auth.signOut();
    document.getElementById('list').innerHTML = '';
    await refreshAuthUI();
  }

  function renderReport(r) {
    return `
      <div class="card">
        <div><b>${escapeHtml(r.title || '(no title)')}</b>
          <span class="pill">${escapeHtml(r.type)}</span>
          <span class="pill">${escapeHtml(r.priority)}</span>
          <span class="pill">${escapeHtml(r.status)}</span>
        </div>
        <div class="muted">id: ${r.id}</div>
        <div class="muted">listing: ${r.listing_id || '-'}</div>
        <div style="margin-top:8px;">${escapeHtml(r.content || '')}</div>
        <div class="muted" style="margin-top:8px;">${new Date(r.created_at).toLocaleString()}</div>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }

  async function loadMy() {
    const token = await getToken();
    if (!token) return;

    const res = await fetch('/.netlify/functions/report_my', {
      headers: { Authorization: `Bearer ${token}` }
    });
    const out = await res.json();
    if (!out.ok) {
      document.getElementById('list').innerHTML = `<div class="err">${escapeHtml(out.error || 'error')}</div>`;
      return;
    }
    document.getElementById('list').innerHTML = (out.reports || []).map(renderReport).join('') || '<div class="muted">No tickets.</div>';
  }

  async function submitTicket() {
    const token = await getToken();
    if (!token) {
      document.getElementById('msg').innerHTML = `<span class="err">${i18n[lang].needLogin}</span>`;
      return;
    }
    const payload = {
      type: document.getElementById('type').value,
      priority: document.getElementById('priority').value,
      listing_id: document.getElementById('listing_id').value.trim() || null,
      title: document.getElementById('title').value.trim() || '',
      content: document.getElementById('content').value.trim()
    };

    document.getElementById('msg').textContent = '...';
    const res = await fetch('/.netlify/functions/report_create', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if (!out.ok) {
      document.getElementById('msg').innerHTML = `<span class="err">${i18n[lang].failed}${escapeHtml(out.error || '')}</span>`;
      return;
    }

    document.getElementById('msg').innerHTML = `<span class="ok">${i18n[lang].submitted}</span>`;
    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
    document.getElementById('listing_id').value = '';
    await loadMy();
  }

  document.getElementById('btnLang').onclick = () => {
    lang = (lang === 'zh') ? 'en' : 'zh';
    localStorage.setItem('lang', lang);
    applyLang();
  };
  document.getElementById('btnSubmit').onclick = submitTicket;
  document.getElementById('btnLogin').onclick = quickLogin;
  document.getElementById('btnLogout').onclick = logout;

  applyLang();
  refreshAuthUI();
</script>

</body>
</html>
