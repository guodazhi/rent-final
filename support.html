<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>客服 · 翱翔安居</title>
  <meta name="theme-color" content="#f7f7fb" />

  <!-- ✅ 每个页面都要加的脚本（放在 <head> 里） -->
  <script defer src="assets/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{--bg:#f7f7fb;--card:#fff;--text:#121826;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--brand2:#0ea5e9;--shadow:0 10px 30px rgba(17,24,39,.08);--radius:18px;}
    *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(247,247,251,.78);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:34px;height:34px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
    .logo img{width:100%;height:100%;object-fit:cover}
    .brand h1{margin:0;font-size:15px;font-weight:900}
    .brand small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:12px;font-weight:800;cursor:pointer;font-size:13px}
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff}
    .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
    .pill b{color:var(--text)}
    .wrap{max-width:980px;margin:0 auto;padding:18px 16px 90px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}
    .hero h2{margin:0;font-size:24px} .hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;outline:none}
    textarea{min-height:120px;resize:vertical}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px}
    .field{grid-column:span 6} .field.w12{grid-column:span 12}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
    .hint{font-size:12px;color:var(--muted)}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#111827;color:#fff;padding:10px 12px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw}
    .toast.show{opacity:1}
    .nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line)}
    .nav-inner{max-width:980px;margin:0 auto;display:flex;justify-content:space-around;padding:10px 12px}
    .nav a{width:25%;text-align:center;color:var(--muted);font-size:12px;font-weight:900;padding:6px 0;border-radius:12px}
    .nav a.active{color:var(--brand)}
    .nav .ico{display:block;font-size:18px;margin-bottom:4px}
    @media (max-width:520px){.field{grid-column:span 12}}
  </style>

  <script>
    const I18N={zh:{appName:"翱翔安居 · XATU",appSub:"客服 / 反馈",title:"客服与反馈",sub:"提交问题/建议，我们会处理",needLogin:"未登录也可提交（建议登录便于追踪）",ok:"已提交，我们会尽快处理",lang:"EN",login:"登录",logout:"退出",rent:"租房",submit:"发布",favorites:"收藏",support:"客服"},
               en:{appName:"Aoxiang Housing · XATU",appSub:"Support / Feedback",title:"Support & Feedback",sub:"Submit issues or suggestions",needLogin:"You can submit without login (login recommended)",ok:"Submitted. We'll review soon.",lang:"中文",login:"Login",logout:"Logout",rent:"Rent",submit:"Post",favorites:"Favorites",support:"Support"}};
    const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
    function getLang(){return localStorage.getItem("APP_LANG")||"zh"} function setLang(l){localStorage.setItem("APP_LANG",l);document.documentElement.setAttribute("data-lang",l);applyI18n()}
    function t(k){return (I18N[getLang()]&&I18N[getLang()][k])||I18N.zh[k]||k}
    function showToast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove("show"),2200)}
    function getSupabase(){ if(!window.APP_CONFIG||!APP_CONFIG.SUPABASE_URL||!APP_CONFIG.SUPABASE_ANON_KEY) return null; if(!window.__sb) window.__sb=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY); return window.__sb; }
    function applyI18n(){
      $("#appTitle").textContent=t("appName"); $("#appSub").textContent=t("appSub");
      $("#pageTitle").textContent=t("title"); $("#pageSub").textContent=t("sub");
      $("#tip").textContent=t("needLogin");
      $("#btnLang").textContent=t("lang");
      $("#btnAuth").textContent=t("login"); $("#btnLogout").textContent=t("logout");
      $("#navRentTxt").textContent=t("rent"); $("#navSubmitTxt").textContent=t("submit"); $("#navFavTxt").textContent=t("favorites"); $("#navSupportTxt").textContent=t("support");
    }
    function setActiveNav(){ const path=location.pathname.split("/").pop()||"support.html"; $$("#bottomNav a").forEach(a=>a.classList.toggle("active",a.getAttribute("data-page")===path)); }

    async function refreshUserUI(){
      const sb=getSupabase(); if(!sb){showToast("Not configured"); $("#btnAuth").style.display="none"; $("#btnLogout").style.display="none"; return null;}
      const {data:{user}}=await sb.auth.getUser();
      if(user){ $("#userPill").innerHTML=`<span>✅</span><b>${user.email||"User"}</b>`; $("#btnAuth").style.display="none"; $("#btnLogout").style.display="inline-block"; }
      else{ $("#userPill").innerHTML=`<span>👤</span><b>${t("login")}</b>`; $("#btnAuth").style.display="inline-block"; $("#btnLogout").style.display="none"; }
      return user;
    }

    async function submitReport(){
      const sb=getSupabase();
      if(!sb){ showToast("Not configured"); return; }

      const {data:{user}}=await sb.auth.getUser();
      const payload={
        user_id: user?.id || null,
        category: $("#category").value,
        title: $("#title").value.trim(),
        content: $("#content").value.trim(),
        contact: $("#contact").value.trim()
      };
      if(!payload.title || !payload.content){
        showToast("请填写标题与内容");
        return;
      }
      const { error } = await sb.from("reports").insert(payload);
      if(error){ showToast(error.message); return; }
      showToast(t("ok"));
      $("#title").value=""; $("#content").value=""; $("#contact").value="";
    }

    document.addEventListener("DOMContentLoaded", async ()=>{
      setActiveNav();
      setLang(getLang());
      applyI18n();

      $("#btnLang").addEventListener("click", ()=>setLang(getLang()==="zh"?"en":"zh"));
      $("#btnAuth").addEventListener("click", ()=>location.href="index.html#login");
      $("#btnLogout").addEventListener("click", async ()=>{const sb=getSupabase(); await sb.auth.signOut(); showToast("OK"); await refreshUserUI();});
      $("#btnSubmit").addEventListener("click", submitReport);

      const sb=getSupabase();
      if(!sb){ showToast("Not configured"); return; }
      sb.auth.onAuthStateChange(async ()=>refreshUserUI());
      await refreshUserUI();
    });
  </script>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><img src="assets/logo.png" alt="logo" onerror="this.style.display='none'"></div>
        <div>
          <h1 id="appTitle">翱翔安居 · XATU</h1>
          <small id="appSub">客服 / 反馈</small>
        </div>
      </div>
      <div class="actions">
        <div class="pill" id="userPill"><span>👤</span><b>登录</b></div>
        <button class="btn" id="btnLang">EN</button>
        <button class="btn primary" id="btnAuth">登录</button>
        <button class="btn" id="btnLogout" style="display:none">退出</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="hero">
      <h2 id="pageTitle">客服与反馈</h2>
      <p id="pageSub">提交问题/建议，我们会处理</p>
    </div>

    <div class="card">
      <div class="hint" id="tip">未登录也可提交（建议登录便于追踪）</div>

      <div class="grid">
        <div class="field">
          <label>分类</label>
          <select id="category">
            <option value="bug">Bug / 功能异常</option>
            <option value="suggestion">建议 / 体验优化</option>
            <option value="report">举报 / 虚假信息</option>
            <option value="other">其他</option>
          </select>
        </div>

        <div class="field">
          <label>联系方式（可选）</label>
          <input id="contact" placeholder="微信/手机号/邮箱（可选）" />
        </div>

        <div class="field w12">
          <label>标题</label>
          <input id="title" placeholder="一句话描述问题/建议" />
        </div>

        <div class="field w12">
          <label>内容</label>
          <textarea id="content" placeholder="请详细说明：发生时间、页面、复现步骤、截图说明等…"></textarea>
        </div>
      </div>

      <div class="row">
        <button class="btn primary" id="btnSubmit">提交</button>
        <span class="hint">提交后会进入后台 reports 表，管理员可处理。</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="nav">
    <div class="nav-inner" id="bottomNav">
      <a href="index.html" data-page="index.html"><span class="ico">🏠</span><span id="navRentTxt">租房</span></a>
      <a href="submit.html" data-page="submit.html"><span class="ico">➕</span><span id="navSubmitTxt">发布</span></a>
      <a href="favorites.html" data-page="favorites.html"><span class="ico">⭐</span><span id="navFavTxt">收藏</span></a>
      <a href="support.html" data-page="support.html" class="active"><span class="ico">💬</span><span id="navSupportTxt">客服</span></a>
    </div>
  </div>
</body>
</html>
