<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>客服与反馈 - 翻翔安居 · XATU</title>

  <script src="/assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#2563eb;--primary2:#1d4ed8;--border:#e5e7eb;--shadow:0 10px 30px rgba(0,0,0,.06);--r:16px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial}
    .top{position:sticky;top:0;z-index:50;background:rgba(246,247,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .topin{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
    .btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.primary:hover{background:var(--primary2)}
    .container{max-width:1100px;margin:0 auto;padding:18px 16px 96px}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
    .title{margin:10px 0 6px;font-size:22px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;outline:none;background:#fff}
    .field textarea{min-height:140px;resize:vertical}
    .hint{font-size:12px;color:var(--muted)}
    .err{color:#b91c1c;font-size:13px;margin-top:10px;display:none}
    .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;z-index:60}
    .navin{width:min(1100px,100%);display:flex;justify-content:space-around;padding:10px}
    .nav a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:8px 12px;border-radius:12px;text-decoration:none}
    .nav a.active{color:var(--primary);background:rgba(37,99,235,.08);font-weight:700}
    @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="top">
    <div class="topin">
      <button class="btn" onclick="history.back()">← 返回</button>
      <div style="font-weight:800">客服与反馈</div>
      <div style="color:var(--muted);font-size:12px">提交问题/建议，我们会处理</div>
      <div style="flex:1"></div>
      <button class="btn" onclick="location.href='/'">去浏览</button>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <div class="title">客服与反馈</div>
      <div class="sub">未登录也可提交（建议留下联系方式）</div>

      <div class="grid2">
        <div class="field">
          <label>分类</label>
          <select id="category">
            <option>Bug / 功能异常</option>
            <option>体验建议</option>
            <option>内容举报</option>
            <option>其他</option>
          </select>
        </div>
        <div class="field">
          <label>联系方式（可选）</label>
          <input id="contact" placeholder="微信/手机号/邮箱（可选）">
        </div>
      </div>

      <div class="field" style="margin-top:10px">
        <label>标题</label>
        <input id="title" placeholder="一句话描述问题/建议">
      </div>

      <div class="field" style="margin-top:10px">
        <label>内容</label>
        <textarea id="content" placeholder="请详细说明：发生时间、页面、复现步骤、截图说明等…"></textarea>
      </div>

      <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <button class="btn primary" id="btnSend" onclick="submitReport()">提交</button>
        <span class="hint">提交后写入 Supabase：reports</span>
      </div>

      <div id="err" class="err"></div>
    </div>
  </div>

  <div class="nav">
    <div class="navin">
      <a href="/"><span>🏠</span><span>租房</span></a>
      <a href="/submit"><span>➕</span><span>发布</span></a>
      <a href="/favorites"><span>⭐</span><span>收藏</span></a>
      <a class="active" href="/support"><span>🛟</span><span>客服</span></a>
    </div>
  </div>

  <script>
    window.sb = window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);

    function setErr(msg){ const e=document.getElementById("err"); e.style.display=msg?'block':'none'; e.textContent=msg||''; }

    async function submitReport(){
      setErr("");
      const btn=document.getElementById("btnSend");
      btn.disabled=true; btn.textContent="提交中…";
      try{
        const category=document.getElementById("category").value;
        const contact=document.getElementById("contact").value.trim();
        const title=document.getElementById("title").value.trim();
        const content=document.getElementById("content").value.trim();

        if(!title) throw new Error("请填写标题");
        if(!content) throw new Error("请填写内容");

        const { data: u } = await window.sb.auth.getUser();
        const user_id = u?.user?.id || null;

        const { error } = await window.sb.from("reports").insert({
          category, contact, title, content, user_id
        });
        if(error) throw new Error(error.message);

        alert("提交成功：感谢反馈");
        document.getElementById("title").value="";
        document.getElementById("content").value="";
      }catch(e){
        setErr("提交失败：" + e.message);
      }finally{
        btn.disabled=false; btn.textContent="提交";
      }
    }
  </script>
</body>
</html>
