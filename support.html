<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>客服与反馈 · 翱翔安居 XATU</title>

  <script src="/assets/config.js"></script>
  <link rel="stylesheet" href="/assets/app.css" />
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <div class="container pad-bottom">
    <div class="shell">
      <div class="topbar">
        <a class="backbtn" href=" " aria-label="back">← 返回</a >

        <div class="brand">
          < img src="/assets/logo.png" alt="logo" />
          <div>
            <div class="title">翱翔安居 · XATU</div>
            <div class="sub">客服 / 反馈</div>
          </div>
        </div>

        <div class="actions">
          <a class="pill" href="/favorites.html">⭐ <small>收藏</small></a >
          <a class="pill" href="/submit.html">＋ <small>发布</small></a >
        </div>
      </div>

      <div class="header">
        <div class="h1">客服与反馈</div>
        <div class="h2">提交问题/建议，我们会尽快处理</div>
      </div>

      <div class="card filters">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap:12px">
          <div class="field">
            <label>分类</label>
            <select id="type">
              <option>Bug / 功能异常</option>
              <option>建议 / 需求</option>
              <option>举报 / 虚假房源</option>
              <option>其他</option>
            </select>
          </div>
          <div class="field">
            <label>联系方式（可选）</label>
            <input id="contact" placeholder="微信/手机号/邮箱（可选）" />
          </div>
        </div>

        <div class="field" style="margin-top:12px">
          <label>标题</label>
          <input id="title" placeholder="一句话描述问题/建议" />
        </div>

        <div class="field" style="margin-top:12px">
          <label>内容</label>
          <textarea id="content" placeholder="请详细说明：发生时间、页面、复现步骤、截图链接等…"></textarea>
        </div>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="btnSend">提交</button>
          <div class="badge">提交后会写入 Supabase 的 reports 表</div>
        </div>

        <div class="notice" id="msg" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="inner">
      <a class="tab" href="/"><div class="dot">🏠</div><div>租房</div></a >
      <a class="tab" href="/submit.html"><div class="dot">＋</div><div>发布</div></a >
      <a class="tab" href="/favorites.html"><div class="dot">⭐</div><div>收藏</div></a >
      <a class="tab active" href="/support.html"><div class="dot">💬</div><div>客服</div></a >
    </div>
  </div>

  <script>
    (async function(){
      const { XATU } = window;
      await XATU.auth.setSessionFromUrlIfPresent();

      const msg = document.getElementById("msg");
      const btn = document.getElementById("btnSend");

      btn.onclick = async () => {
        XATU.ui.setNotice(msg, "", "notice");
        const payload = {
          type: document.getElementById("type").value,
          contact: document.getElementById("contact").value.trim() || null,
          title: document.getElementById("title").value.trim(),
          content: document.getElementById("content").value.trim(),
          page: location.origin,
          status: "open"
        };
        if(!payload.title || !payload.content){
          XATU.ui.setNotice(msg, "请填写标题和内容", "err"); return;
        }
        try{
          btn.disabled = true;
          await XATU.support.create(payload);
          XATU.ui.setNotice(msg, "提交成功，感谢反馈！", "ok");
          document.getElementById("title").value = "";
          document.getElementById("content").value = "";
        }catch(e){
          XATU.ui.setNotice(msg, "提交失败：" + e.message + "（请检查 reports 表 insert policy / RLS）", "err");
        }finally{
          btn.disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
