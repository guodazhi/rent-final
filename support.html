<!doctype html><html lang="zh"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Support</title><link rel="icon" href="favicon.ico"/><link rel="stylesheet" href="assets/styles.css"/>
</head><body>
<div class="topbar"><div class="brand">< img src="assets/logo.png" onerror="this.style.display='none'"><span data-i18n="brand"></span></div><button class="lang" id="langBtn"></button></div>
<div class="wrap">
  <div class="h1" data-i18n="supportTitle"></div>
  <form id="fb">
    <div class="row">
      <select class="input" id="fbCategory">
        <option value="general">General</option>
        <option value="bug">Bug</option>
        <option value="fraud">Fraud</option>
        <option value="repair">Repair</option>
      </select>
    </div>
    <textarea class="input" id="fbContent" rows="5" data-i18n-placeholder="feedbackHint" placeholder=""></textarea>
    <div class="row"><button class="btn btnPrimary" data-i18n="feedbackSubmit"></button></div>
    <div id="fbStatus" class="hint"></div>
  </form>
</div>
<div class="nav">
<a href=" "><div>🏠</div><div data-i18n="navRent"></div></a >
<a href="submit.html"><div>➕</div><div data-i18n="navSubmit"></div></a >
<a href="favorites.html"><div>⭐</div><div data-i18n="navFav"></div></a >
<a class="active" href="support.html"><div>💬</div><div data-i18n="navSupport"></div></a >
</div>
<script src="assets/i18n.js"></script><script src="assets/app.js"></script>
<script>
I18N_HELPER.applyI18n();
langBtn.onclick=()=>I18N_HELPER.setLang(I18N_HELPER.getLang()==="zh"?"en":"zh");
document.getElementById("fb").addEventListener("submit", APP.sendFeedback);
</script>
</body></html>
